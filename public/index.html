<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pinax — 蔵書</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23AD3D2B'/%3E%3Cpath d='M8 7h5.5c1.9 0 3 1 3 2.6V25H8zm8.5 2.6C16.5 8 17.6 7 19.5 7H24v18h-7.5z' fill='%23F6EFE7'/%3E%3C/svg%3E">
<style>
:root {
  --brand: #AD3D2B;
  --brand-dim: #8d3123;
  --brand-soft: #f6e7e3;
  --ink: #22201f;
  --ink-2: #5d5754;
  --ink-3: #8d8582;
  --bg: #faf7f3;
  --panel: #ffffff;
  --line: #e6ded6;
  --gap: #c2410c;
  --ok: #3f7d58;
  /* 要ケア。要確認 (--gap のオレンジ) の隣に並ぶので、はっきり別の色にする —
     機械が気付いた綻びと、人が中を見て決めた印は、同じ札に見えてはいけない */
  --care: #6d4aa8;
  --care-soft: #efe9f8;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(40,25,20,.06), 0 6px 18px rgba(40,25,20,.07);
}
@media (prefers-color-scheme: dark) {
  :root {
    --brand: #d05942;
    --brand-dim: #b9452f;
    --brand-soft: #3a221d;
    --ink: #ece6e1;
    --ink-2: #b5aba5;
    --ink-3: #867c77;
    --bg: #171412;
    --panel: #201b19;
    --line: #352d29;
    --gap: #e0703f;
    --ok: #6cae87;
    --care: #ad8ee0;
    --care-soft: #2b2338;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
/**
 * **縦スクロールバーの幅を常に取っておく。**
 * 詳細の板を開く時に body のスクロールを止めるが、取っておかないと止めた瞬間に
 * バーが消えて画面が 15px ほど広がり、棚のカード (auto-fill) が一斉に少しだけ
 * 大きくなる。PC で「モーダルの下の画面がガタつく」のはこれ
 */
html { scrollbar-gutter: stable; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.6 "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brand); }

/* ---- ヘッダ ---- */
header {
  position: sticky; top: 0; z-index: 30;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.bar { display: flex; align-items: center; gap: 16px; padding: 12px 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.logo {
  font: 700 22px/1 "Palatino Linotype", "Hiragino Mincho ProN", serif;
  letter-spacing: .14em; color: var(--brand); text-transform: lowercase;
}
.tagline { font-size: 11px; color: var(--ink-3); letter-spacing: .04em; }
.stats { font-size: 12px; color: var(--ink-2); display: flex; gap: 14px; }
.stats b { color: var(--ink); font-weight: 600; }

.btn {
  border: 1px solid var(--line); background: var(--panel); color: var(--ink-2);
  border-radius: 8px; padding: 7px 13px; font-size: 13px; white-space: nowrap;
}
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-dim); color: #fff; }
.btn[disabled] { opacity: .5; cursor: default; }
.acts { display: flex; gap: 8px; }
#more { display: none; }

/* ---- 道具立て ---- */
.tools { display: flex; gap: 8px; padding: 0 20px 12px; flex-wrap: wrap; align-items: center; }
.search {
  flex: 1 1 240px; min-width: 180px; max-width: 420px;
  border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 12px;
}
.search:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: transparent; color: var(--ink-2);
  border-radius: 999px; padding: 6px 13px; font-size: 12.5px;
}
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
select.sort { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 10px; font-size: 13px; }

/* ---- お知らせ ---- */
.news { margin: 16px 20px 0; border: 1px solid var(--line); border-left: 3px solid var(--brand); border-radius: var(--radius); background: var(--panel); }
.news-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; font-size: 13px; font-weight: 600; }
.news-head .count { background: var(--brand); color: #fff; border-radius: 999px; padding: 1px 8px; font-size: 11px; }
.news ul { margin: 0; padding: 0 14px 12px; list-style: none; display: grid; gap: 6px; }
.news li { font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; }
.news li b { color: var(--ink); font-weight: 600; }
.news .kind { color: var(--brand); font-size: 11px; border: 1px solid var(--brand); border-radius: 4px; padding: 0 5px; align-self: center; }

/* ---- 棚 ---- */
main { padding: 16px 20px 60px; }
.count-line { font-size: 12px; color: var(--ink-3); margin: 4px 2px 12px; }
.grid {
  display: grid; gap: 18px 14px;
  grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
}
.card { background: none; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 7px; }
.cover {
  position: relative; aspect-ratio: 2 / 3; border-radius: 6px; overflow: hidden;
  background: linear-gradient(150deg, var(--brand-soft), var(--line));
  box-shadow: var(--shadow); display: grid; place-items: center;
}
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover .none {
  font: 600 11px/1.5 sans-serif; color: var(--ink-3); text-align: center; padding: 8px; word-break: break-word;
}
.card:hover .cover { outline: 2px solid var(--brand); outline-offset: 2px; }
.badges { position: absolute; top: 5px; left: 5px; right: 5px; display: flex; gap: 4px; flex-wrap: wrap; }
.badge { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; color: #fff; background: rgba(0,0,0,.55); backdrop-filter: blur(2px); }
.badge.gap { background: var(--gap); }
.fav-mark { position: absolute; top: 3px; right: 6px; font-size: 18px; line-height: 1; color: #f2b01e; text-shadow: 0 0 3px rgba(0,0,0,.6); }
.cover:has(.fav-mark) .badges { right: 26px; }
.favsec { margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.badge.done { background: var(--ok); }
.c-title { font-size: 12.5px; font-weight: 600; line-height: 1.35; }
.c-meta { font-size: 11px; color: var(--ink-3); }

/* ---- 詳細 ----
   スマホでは下から生える板にする。**上に地の画面を覗かせたまま止める** —
   全画面に被せると、今開いているのが別の画面なのか作品の中なのか分からなくなる。
   中身は .sheet-body だけが動き、× を載せた頭は常に居座る (スクロールで逃げない) */
.sheet {
  position: fixed; inset: 0; z-index: 50; background: rgba(25,15,12,.5);
  display: flex; justify-content: center; align-items: flex-start; padding: 3vh 16px;
  overscroll-behavior: contain;
}
.sheet[hidden] { display: none; }
.sheet-inner {
  background: var(--panel); border-radius: 14px; box-shadow: var(--shadow);
  width: min(920px, 100%); max-height: 94vh;
  display: flex; flex-direction: column; overflow: hidden;
}
.sheet-head {
  flex: none; display: flex; align-items: center; gap: 10px;
  padding: 11px 12px 11px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
}
.sheet-head .grip { display: none; }
.sheet-title {
  flex: 1; min-width: 0; font-size: 13px; font-weight: 600; color: var(--ink-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.close {
  flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 8px;
  font-size: 19px; line-height: 1; color: var(--ink-2); padding: 6px 14px;
}
.close:hover { border-color: var(--brand); color: var(--brand); }
.sheet-body {
  overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: 20px;
}
/* タイトルは表紙の右。**狭い画面でも折り返して下へ落とさない** —
   同じ作品でも端末で居場所が変わると、次に見る時に目が迷う */
.d-head { display: flex; gap: 20px; }
.d-cover { width: 150px; flex: none; aspect-ratio: 2/3; border-radius: 8px; overflow: hidden; background: var(--brand-soft); box-shadow: var(--shadow); }
.d-cover img { width: 100%; height: 100%; object-fit: cover; }
.d-info { flex: 1 1 0; min-width: 0; }
.d-info h2 { margin: 0 0 4px; font-size: 20px; line-height: 1.35; }
.d-titlerow { display: flex; align-items: flex-start; gap: 8px; }
.d-titlerow h2 { flex: 1 1 0; min-width: 0; }
.fav { flex: none; background: none; border: 0; padding: 0 2px; font-size: 26px; line-height: 1; color: var(--ink-3); cursor: pointer; }
.fav.on { color: #f2b01e; }
.d-author { color: var(--brand); font-size: 13px; font-weight: 600; margin-bottom: 10px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; color: var(--ink-2); }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; word-break: break-all; }
.gapline { margin: 12px 0 0; padding: 9px 12px; border-radius: 8px; background: var(--brand-soft); color: var(--gap); font-size: 13px; font-weight: 600; }
.d-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

h3.sec { font-size: 13px; color: var(--ink-3); font-weight: 600; margin: 24px 0 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.vols { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
.vol { display: flex; flex-direction: column; gap: 5px; position: relative; }
.vol .cover { aspect-ratio: 2/3; }
.vol .lbl { font-size: 11.5px; font-weight: 600; text-align: center; }
.vol .th { font-family: inherit; font-size: 11px; text-align: center; border: 1px solid var(--line); background: transparent; border-radius: 5px; padding: 3px; color: var(--ink-2); display: block; width: 100%; cursor: pointer; }
.vol .th:hover { border-color: var(--brand); color: var(--brand); }
.vol .th.dots { letter-spacing: .12em; }
/**
 * 板の操作は「···」1 つに畳む。**板の上にボタンを並べない** — 巻が 30 も 40 も
 * ある作品で、1 枚あたり 3 つのボタンが縦に積まれると棚が読めなくなる。
 * 開いた時だけ浮かせるので、格子の行の高さは動かない
 */
.volmenu {
  position: absolute; top: 100%; left: 0; z-index: 5; min-width: 148px; margin-top: 2px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: var(--shadow); padding: 4px; display: grid; gap: 2px;
}
/* 右端の板では左へ伸ばす。そのままだと板の外へ出て押せない */
.volmenu.right { left: auto; right: 0; }
.volmenu button {
  font-family: inherit; font-size: 12px; text-align: left; border: 0; background: transparent;
  color: var(--ink-2); border-radius: 6px; padding: 7px 9px; width: 100%; white-space: nowrap;
}
.volmenu button:hover { background: var(--brand-soft); color: var(--brand); }
.volmenu button.care { color: var(--care); font-weight: 600; }
.volmenu button.care:hover { background: var(--care-soft); color: var(--care); }
/* 持っていない巻。**欠番と未購入を分けない** (出ているのに無い、が分かれば足りる) */
.vol.missing .cover { background: repeating-linear-gradient(45deg, transparent, transparent 6px, var(--gap) 6px, var(--gap) 7px); box-shadow: none; border: 1px dashed var(--gap); }
.vol.missing .lbl { color: var(--gap); }
.shelfline { margin: 10px 0 0; padding: 9px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; background: var(--brand-soft); color: var(--brand); }
.shelfline.quiet { background: transparent; border: 1px solid var(--line); color: var(--ink-3); font-weight: 500; }
.shelfline small { display: block; font-weight: 400; font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
.badge.ahead { background: var(--brand); }
.loose { font-size: 12px; color: var(--ink-2); display: grid; gap: 4px; }
.loose a { text-decoration: none; }

/* ---- 完結のスイッチ ---- */
.setrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; font-size: 13px; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.track {
  flex: none; width: 42px; height: 24px; border-radius: 999px; background: var(--line);
  position: relative; transition: background .15s;
}
.track::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.35);
  transition: transform .15s;
}
.switch input:checked + .track { background: var(--ok); }
.switch input:checked + .track::after { transform: translateX(18px); }
.switch input:focus-visible + .track { outline: 2px solid var(--brand); outline-offset: 2px; }
.switch input:disabled + .track { opacity: .5; }
.setnote { font-size: 11.5px; color: var(--ink-3); }

/**
 * pinax が動いている PC の側で起きること (エクスプローラ) の入口。
 *
 * **「出す条件」ではなく「隠す条件」を書く。** ここは 2 度外している:
 *
 *   1. 接続元アドレスで判定 (2026-09-14) — 手元は PC からも Tailscale の口を
 *      通して見ているので、接続元が pinax 自身のアドレスになるとは限らない
 *   2. `(hover: hover) and (pointer: fine)` で出す (2026-09-15) — 手元の Brave は
 *      hover / pointer / any-hover / any-pointer を**全部 false** で答える。
 *      `any-` を足しても救えず、PC で見ているのにボタンが消えたまま
 *
 * どちらも「PC だと分かった時だけ出す」書き方で、**判定できない環境が丸ごと
 * 「PC ではない」側へ落ちた**。逆に書く — 指しか無いと**はっきり分かった**時だけ
 * 隠し、分からなければ出す。起きるのは「PC にウィンドウが 1 枚開く」だけなので、
 * 出し過ぎより出ないことの方が重い (本人の指定)。
 */
.pc-only { display: inline-block; }
/* 指しか無い端末では意味が無いので隠す */
@media (any-pointer: coarse) { .pc-only { display: none; } }
/* ただしマウスも有るなら PC。タッチ画面付きのノートがここへ落ちる */
@media (any-pointer: coarse) and (any-pointer: fine) { .pc-only { display: inline-block; } }

/* ---- 要確認 (巻の重複・巻数不明) ---- */
.issueline { margin: 10px 0 0; padding: 9px 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
  background: var(--brand-soft); color: var(--gap); }
.issueline small { display: block; font-weight: 400; font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
.badge.warn { background: var(--gap); }
.vol.dup .cover { outline: 2px solid var(--gap); outline-offset: -2px; }
.filelist { display: grid; gap: 8px; font-size: 12px; }
.filelist .grp { display: grid; gap: 3px; }
.filelist .grp > b { font-size: 12px; color: var(--gap); font-weight: 600; }
.filelist .row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; color: var(--ink-2); }
.filelist .row .nm { word-break: break-all; flex: 1 1 240px; }
.filelist .row .sz { color: var(--ink-3); font-size: 11px; }
.filelist a { text-decoration: none; }
.mini { border: 1px solid var(--line); background: transparent; color: var(--ink-3); border-radius: 6px;
  padding: 2px 8px; font-size: 11px; white-space: nowrap; }
.mini:hover { border-color: var(--brand); color: var(--brand); }
.more { font-size: 11.5px; color: var(--ink-3); }

/* ---- 要ケア (壊れている・スキャンがひどい) ----
   **要確認と色も置き場も分ける。** 要確認は機械が気付いた棚の綻びで、直しようが
   無いものも混ざる。要ケアは人が中を見て「手を入れたい」と決めた印で、
   数も理由も人にしか分からない */
.badge.care { background: var(--care); }
.chip.care[aria-pressed="true"] { background: var(--care); border-color: var(--care); }
.vol.care .cover { outline: 2px solid var(--care); outline-offset: -2px; }
.filelist .row .mini.care-on { border-color: var(--care); background: var(--care); color: #fff; }
.filelist .row .mini.care-on:hover { border-color: var(--care); color: #fff; }

/* 印の付いた本だけを並べる節。**メモを書くのはここ 1 箇所。**
   板の下に入力欄をぶら下げると格子の行が丸ごと伸びて並びが崩れる */
.carebox { margin: 10px 0 0; padding: 12px; border: 1px solid var(--line);
  border-left: 3px solid var(--care); border-radius: var(--radius); display: grid; gap: 12px; }
.carerow { display: grid; gap: 5px; }
.carerow .hd { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.carerow .hd b { font-size: 12.5px; color: var(--care); font-weight: 600; }
.carerow .hd .nm { font-size: 11.5px; color: var(--ink-3); word-break: break-all; flex: 1 1 200px; }
.carerow input { border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 8px; padding: 7px 10px; font-size: 13px; width: 100%; }
.carerow input:focus { outline: 2px solid var(--care-soft); border-color: var(--care); }
.carenote-hint { font-size: 11.5px; color: var(--ink-3); }

/* ---- 名前を直す ---- */
.rnbox { margin: 12px 0 0; padding: 12px; border: 1px solid var(--line); border-left: 3px solid var(--brand);
  border-radius: var(--radius); background: var(--panel); display: grid; gap: 10px; }
.rnbox label.fld { display: grid; gap: 4px; font-size: 11.5px; color: var(--ink-3); flex: 1 1 200px; }
.rnbox input[type=text], .rnbox input[type=number] { border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 8px; padding: 8px 12px; font-size: 14px; width: 100%; }
.rnbox input[type=text]:focus, .rnbox input[type=number]:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
.rnrow { display: flex; gap: 10px; flex-wrap: wrap; }
.rnplan { font-size: 12.5px; border-radius: 8px; padding: 9px 12px; background: var(--brand-soft); color: var(--ink-2); }
.rnplan .rnto { font-weight: 700; color: var(--brand); word-break: break-all; }
.rnplan .rnfrom { color: var(--ink-3); text-decoration: line-through; word-break: break-all; }
.rnplan small { display: block; color: var(--ink-3); font-size: 11.5px; margin-top: 4px; }
.rnwarn { color: var(--gap); font-weight: 600; margin-top: 5px; }
.rnsame { font-weight: 400; color: var(--ink-3); }
/* 出どころの添え書き。欄が棚の名前で埋まっていない理由をその場で言う */
.rnfrom-pick { font-size: 11.5px; color: var(--ink-3); margin-top: -4px; }
/* 追従できないファイルは名前で出す。人が手で直す先なので等幅で */
.rnstuck { margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--line);
  font-size: 11.5px; color: var(--ink-3); }
.rnstuck ul { margin: 4px 0 0; padding-left: 18px; }
.rnstuck li { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  word-break: break-all; line-height: 1.5; }
.rnacts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.rnacts .go { border-color: var(--brand); color: var(--brand); font-weight: 700; }
.rnnote { font-size: 11.5px; color: var(--ink-3); }

/* ---- 合本を分割する ----
   名前を直す紙 (.rnbox) と同じ顔にする。**どちらも棚の実物を動かす**ので、
   見た目が違うと片方だけ軽い操作に見える */
.spbox { margin: 12px 0 0; padding: 12px; border: 1px solid var(--line); border-left: 3px solid var(--brand);
  border-radius: var(--radius); background: var(--panel); display: grid; gap: 10px; font-size: 12.5px; }
.sphead { font-weight: 600; }
.spmeta { font-weight: 400; color: var(--ink-3); }
.spplan { border-radius: 8px; padding: 9px 12px; background: var(--brand-soft); color: var(--ink-2); }
.spto { font-weight: 700; color: var(--brand); word-break: break-all;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; line-height: 1.6; }
.spto .spmeta { font-family: inherit; font-weight: 400; }
.spfrom { color: var(--ink-3); text-decoration: line-through; word-break: break-all;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
/* 分割できない時は、地の色のまま点線で出す。押せるものが無いことが一目で分かるように */
.spno { border: 1px dashed var(--line); border-radius: 8px; padding: 9px 12px; color: var(--ink-3); }
.spno .spwarn { color: var(--gap); font-weight: 600; margin-bottom: 4px; }
.spacts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spacts .go { border-color: var(--brand); color: var(--brand); font-weight: 700; }
.spwork { color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
/* 棚に同じ巻が既にあって ` (2)` を付けて置く巻。断らずに割るが、割った後に見比べる用事が残ることを先に言う */
.spclash { display: block; font-family: inherit; font-weight: 400; color: var(--gap); font-size: 11.5px; }

/* ---- 同じ巻のファイルを見比べる ----
   分割の紙と同じく**棚の実物を動かす**ので、同じ顔 (左の帯) にする */
.cmps { display: grid; gap: 12px; }
.cmp { padding: 12px; border: 1px solid var(--line); border-left: 3px solid var(--gap);
  border-radius: var(--radius); background: var(--panel); display: grid; gap: 10px; font-size: 12.5px; }
.cmphead { color: var(--gap); font-weight: 600; }
.cmpnote { color: var(--gap); font-size: 11.5px; }
.cmpcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.cmpcol { border: 1px solid var(--line); border-radius: 8px; padding: 9px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.cmpmeta { color: var(--ink-3); font-size: 11.5px; }
.cmpmeta b { color: var(--ink); font-weight: 600; }
/* 絵は横に流す。縦に積むと 2 本を並べた時に見比べる距離が遠くなる */
.cmpthumbs { display: flex; gap: 6px; overflow-x: auto; min-height: 120px; align-items: flex-start; }
.cmpthumb { flex: 0 0 auto; display: grid; gap: 2px; justify-items: center; color: var(--ink-3); font-size: 10.5px; }
.cmpthumb img { height: 120px; width: auto; max-width: 110px; object-fit: contain; border-radius: 4px;
  background: var(--brand-soft); box-shadow: var(--shadow); }
.cmpcol .spacts .go { border-color: var(--brand); color: var(--brand); font-weight: 700; }

/* ---- 棚に無い作品の名前を作る ---- */
.nm-hint { font-size: 11.5px; color: var(--ink-3); margin-top: 9px; }
.nm-row { display: flex; gap: 8px; align-items: center; background: var(--bg); margin-top: 9px;
  border: 1px solid var(--line); border-radius: 7px; padding: 5px 6px 5px 10px; }
/* 名前は等幅で出す。[ ] と数字の並びを目で確かめる紙なので、字幅が揃っている方が読める */
.nm-name { flex: 1 1 auto; min-width: 0; font-size: 12.5px; line-height: 1.45; word-break: break-all;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.nm-row .mini { flex: none; }

/* ---- 表紙を選ぶ ----
   詳細の板の中で中身だけ差し替える。もう 1 枚重ねると、Android の戻るで
   どちらが閉じるのか分からなくなる (詳細の板は履歴を 1 つ積んで開いている) */
.pk-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.pk-for { font-size: 13px; color: var(--ink-2); }
.pk-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.pk-form input { flex: 1 1 180px; min-width: 140px; border: 1px solid var(--line); background: var(--bg);
  border-radius: 8px; padding: 8px 12px; }
.pk-form input:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
.pk-note { font-size: 12px; color: var(--ink-3); margin-bottom: 12px; }
.pk-note.warn { color: var(--gap); }
.pk-now { margin: 0 0 14px; padding: 9px 12px; border-radius: 8px; background: var(--brand-soft);
  color: var(--brand); font-size: 13px; font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pk-now small { display: block; font-weight: 400; font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }

.pk-group { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.pk-g-cover { flex: none; width: 64px; aspect-ratio: 2/3; border-radius: 5px; overflow: hidden;
  background: var(--brand-soft); display: grid; place-items: center; }
.pk-g-cover img { width: 100%; height: 100%; object-fit: cover; }
.pk-g-info { flex: 1 1 auto; min-width: 0; }
.pk-g-title { font-size: 14px; font-weight: 600; line-height: 1.35; word-break: break-word; }
.pk-g-meta { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
.pk-g-acts { display: flex; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
.pk-tag { font-size: 10px; font-weight: 600; border: 1px solid var(--line); border-radius: 4px;
  padding: 1px 5px; color: var(--ink-3); vertical-align: 2px; margin-left: 6px; }
.pk-group.on { background: var(--brand-soft); border-radius: 8px; padding: 12px; }

.pk-g-cover, .pk-item .cover { position: relative; }
/* 書影の無い候補は書名が板に出る。64px の枠に長い書名が来るので、ここだけ詰める */
.pk-g-cover .none { font-size: 9px; line-height: 1.3; padding: 4px; max-height: 100%; overflow: hidden; }
.pk-item .none { font-size: 10px; }
.pk-g-cover img.over, .pk-item .cover img.over { position: absolute; inset: 0; }
.pk-items { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
  padding: 4px 0 14px; }
.pk-item { display: flex; flex-direction: column; gap: 4px; }
.pk-item .cover { aspect-ratio: 2/3; }
.pk-item .lbl { font-size: 11px; font-weight: 600; text-align: center; }
.pk-item .sub { font-size: 10px; color: var(--ink-3); text-align: center; word-break: break-word; }

/* 表紙そのものを押して選び直せるようにする。span を button にしただけなので枠を消す */
button.cover { border: 0; padding: 0; font: inherit; }
.vol button.cover:hover { outline: 2px solid var(--brand); outline-offset: 2px; }
.badge.pinned { background: var(--ok); }

.empty { text-align: center; color: var(--ink-3); padding: 60px 20px; }
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 80;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow);
}
.toast[hidden] { display: none; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- 読む ----
 *
 * 板 (.sheet) とは別に、画面を丸ごと覆う。読んでいる間は紙だけが見えていてほしいので、
 * ヘッダも背景も残さない。
 *
 * **明るいテーマでも背景は黒に近い色。** 漫画のページは端まで白いことが多く、
 * 明るい地に置くと紙の縁が溶けてどこまでが絵か分からなくなる
 */
#rd[hidden] { display: none; }
.rd {
  position: fixed; inset: 0; z-index: 60; background: #15120f;
  display: flex; align-items: center; justify-content: center;
  /* 端末の丸みとホームバーを避ける。スマホで下端の帯が指の届かない所に来ないように */
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
.rd-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
/* 縦読みは stage そのものが巻物になる。横読みは 1 枚だけ置く */
.rd-stage.vert { display: block; overflow-y: auto; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; }
.rd-stage.vert .rd-page { width: 100%; }
.rd-stage img { display: block; }
/**
 * 右から左は**横一列の巻物**。1 画面 = 1 マス (.rd-cell) で、ブラウザのスクロールに
 * 1 マスずつ止めさせる (ebookjapan と同じ作り)。**払う動きはブラウザに任せる** —
 * 指を自前で追うと、ブラウザがスクロールとして引き取った時点で pointercancel が来て
 * 何も起きない (スマホで踏んだ)。direction: rtl で先頭が右端、次のページは左隣。
 * touch-action: manipulation で二度押し拡大の待ち時間を消す (めくりが 300ms 遅れる)
 */
.rd-stage.rtl {
  display: flex; justify-content: flex-start; align-items: stretch; direction: rtl;
  overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory; touch-action: manipulation; scrollbar-width: none;
}
.rd-stage.rtl::-webkit-scrollbar { display: none; }
/* 見開きは 1 ページが 2 マスになる。マスを直に並べたいので、ページの箱は消しておく */
.rd-stage.rtl .rd-page { display: contents; }
/* 勢いよく払っても 1 マスで止まる。読み飛ばしたページに気付けない方が困る */
.rd-cell {
  flex: 0 0 100%; height: 100%; overflow: hidden; direction: ltr;
  display: flex; align-items: center; justify-content: center;
  scroll-snap-align: start; scroll-snap-stop: always;
}
/* **マス直下の絵だけ。** 割った半分の中の絵は 2 倍幅で置くので、ここで詰めてはいけない */
.rd-cell > img { max-width: 100%; max-height: 100%; object-fit: contain; }

/**
 * 絵の一部だけを出す窓。**絵は触らない。**
 * 画像はそのまま置いて、窓の方を狭めてずらすだけなので、
 * 元のファイルにも、焼いた表紙にも手を入れずに済む。
 *
 * 用は 2 つある。**横長のページを真ん中で割る**のと、**端から続く無地の帯を
 * 削る**の。どちらも「画像の横 [x0, x1] を窓いっぱいに出す」に過ぎないので、
 * 寸法は JS がインラインで入れる。
 *
 * 右から左は「画面に収まるいちばん大きい窓」を px で出す必要がある
 * (aspect-ratio と max-width を組み合わせると、詰まった時に高さが付いて来ず
 *  窓が狭まって絵が切れる)。縦読みは段の幅が決まっているので割合で足りる
 */
.rd-half { overflow: hidden; margin: auto; }
.rd-half img { display: block; max-width: none; max-height: none; }
.rd-stage.vert .rd-half { width: 100%; }

/* 絵を掴ませない。**掴むと pointercancel が飛んでスワイプが死ぬ** (PC で踏んだ) */
.rd img { user-select: none; -webkit-user-drag: none; }
.rd-msg { color: var(--ink-3); font-size: 13px; text-align: center; line-height: 1.9; padding: 0 28px; }
.rd-msg b { display: block; color: #ece6e1; font-weight: 600; font-size: 14px; margin-bottom: 4px; }

/* 下端の帯。2.5 秒で消える。**消えている間も場所は取り続ける** (位置がずれない) */
.rd-bar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
  background: rgba(21, 18, 15, .94); border-top: 1px solid #3a322c;
  padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
  transition: opacity .22s;
}
.rd-bar[data-off="1"] { opacity: 0; pointer-events: none; }
.rd-row { display: flex; align-items: center; gap: 8px; }
.rd-b {
  font-family: inherit; font-size: 12px; color: #ece6e1; background: transparent;
  border: 1px solid #4a403a; border-radius: 7px; padding: 7px 12px; cursor: pointer;
}
.rd-b:hover { border-color: #867c77; }
/* 読む画面は常に暗いので、--care ではなく明るい方の紫を直に置く */
.rd-b[data-on="1"] { border-color: #ad8ee0; background: #6d4aa8; color: #fff; }
.rd-no { font-size: 12px; color: #b5aba5; font-variant-numeric: tabular-nums; }
.rd-bar input[type=range] { width: 100%; margin: 0 0 8px; accent-color: var(--brand); direction: rtl; }
/* 作者・タイトル・巻の情報行 */
.rd-info {
  font-size: 11px; color: #867c77; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 6px; text-align: center;
}
/* 右上の閉じるボタン。うっすら出しておく */
.rd-x {
  position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 12px; z-index: 3;
  background: transparent; border: none; cursor: pointer;
  font-size: 22px; line-height: 1; color: #ece6e1; opacity: 0.3;
  padding: 6px; border-radius: 6px;
  transition: opacity .18s;
}
.rd-x:hover { opacity: 0.85; }

/* ---- スマホ ----
   詳細は下から生える板。上を 12dvh ほど空けて地の画面を残す (何かの上に乗っていると分かる)。
   dvh はアドレスバーの伸縮に追従する — vh だけだと板の底がバーの裏に隠れて × に指が届かない */
@media (max-width: 640px) {
  /* ヘッダは 2 段まで。棚を見に来ているので、道具立てに画面の 1/3 を渡さない */
  .bar { padding: 9px 14px; gap: 10px; }
  .logo { font-size: 18px; }
  .tagline { display: none; }
  .stats { font-size: 11px; gap: 9px; }
  #more { display: inline-block; padding: 5px 11px; letter-spacing: .1em; }
  /* 棚の読み直しと表紙の取得は ⋯ の下へ畳む。毎回押すものではない */
  .acts { display: none; flex: 1 0 100%; }
  .acts[data-open="1"] { display: flex; }
  .acts .btn { flex: 1; }

  .tools { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 0 14px 10px; }
  .search { grid-area: 1 / 1; max-width: none; min-width: 0; padding: 7px 11px; }
  select.sort { grid-area: 1 / 2; padding: 7px 8px; }
  /* 絞り込みは 1 行に並べて横へ流す。折り返すと段が増えて棚が押し出される */
  .chips { grid-area: 2 / 1 / 3 / 3; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 5px 12px; }

  .sheet { padding: 0; align-items: flex-end; }
  .sheet-inner {
    width: 100%; max-height: 88vh; max-height: 88dvh;
    border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px rgba(25,15,12,.28);
  }
  .sheet-head { flex-wrap: wrap; padding: 7px 10px 10px 16px; }
  .sheet-head .grip {
    display: block; flex: 1 0 100%; height: 4px; width: 40px; margin: 0 auto 7px;
    border-radius: 99px; background: var(--line);
  }
  .sheet-body { padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
  .d-cover { width: 108px; }
  .d-info h2 { font-size: 17px; }
  .bar { padding: 10px 14px; gap: 10px; }
  .tools { padding: 0 14px 10px; }
  main { padding: 14px 14px 48px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px 10px; }
  .news { margin: 12px 14px 0; }
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">
      <span class="logo">pinax</span>
      <span class="tagline">Never burn. Remember Alexandria.</span>
    </div>
    <div class="stats" id="stats"></div>
    <button class="btn" id="more" aria-expanded="false" aria-controls="acts" aria-label="棚の操作">···</button>
    <div class="acts" id="acts">
      <button class="btn" id="scan">棚を読み直す</button>
      <button class="btn" id="names">名前を作る</button>
    </div>
  </div>
  <div class="tools">
    <input class="search" id="q" type="search" placeholder="作品名・著者で探す" autocomplete="off">
    <div class="chips">
      <button class="chip" id="f-gaps" aria-pressed="false">欠番あり</button>
      <button class="chip" id="f-behind" aria-pressed="false">続きが出ている</button>
      <button class="chip" id="f-done" aria-pressed="false">完結</button>
      <button class="chip" id="f-ongoing" aria-pressed="false">継続中</button>
      <button class="chip" id="f-nocover" aria-pressed="false">表紙なし</button>
      <button class="chip" id="f-issues" aria-pressed="false">要確認</button>
      <button class="chip care" id="f-care" aria-pressed="false">要ケア</button>
    </div>
    <select class="sort" id="sort">
      <option value="title">作品名順</option>
      <option value="author">著者順</option>
      <option value="volumes">冊数順</option>
      <option value="added">登録が新しい順</option>
      <option value="updated">更新が新しい順</option>
    </select>
  </div>
</header>

<div id="news"></div>

<main>
  <div class="favsec" id="favsec" hidden>
    <div class="count-line" id="favline"></div>
    <div class="grid" id="favgrid"></div>
  </div>
  <div class="count-line" id="countline"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>見つかりませんでした</div>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-inner" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <span class="grip" aria-hidden="true"></span>
      <span class="sheet-title" id="sheet-title"></span>
      <button class="close" id="sheet-close" aria-label="閉じる">&times;</button>
    </div>
    <div class="sheet-body" id="detail"></div>
  </div>
</div>

<!-- 読む。板の上にさらに重ねるので、閉じても下の詳細はそのまま残る -->
<div class="rd" id="rd" hidden>
  <button class="rd-x" id="rd-close" aria-label="閉じる">×</button>
  <div class="rd-stage" id="rd-stage"></div>
  <div class="rd-bar" id="rd-bar">
    <div class="rd-info" id="rd-info"></div>
    <input type="range" id="rd-slider" min="1" max="1" value="1" aria-label="ページ">
    <div class="rd-row">
      <button class="rd-b" id="rd-mode">縦読み</button>
      <!-- スキャンのひどさに気付くのは読んでいる最中。閉じて板まで戻らずに印を付けられる -->
      <button class="rd-b" id="rd-care">要ケア</button>
      <span style="flex:1"></span>
      <span class="rd-no" id="rd-no"></span>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mb = (n) => n >= 1 << 30 ? (n / (1 << 30)).toFixed(1) + ' GB' : (n / (1 << 20)).toFixed(0) + ' MB';

let toastTimer = null;
function toast(msg, ms = 3000) {
  const t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, ms);
}

/**
 * 文字列を写す。
 *
 * **navigator.clipboard は http の相手には無い。** pinax は Tailscale 越しの
 * 生の http でも開くので、そこでは undefined になって落ちる。見えない textarea に
 * 入れて execCommand で写す古い道を残しておく (それも駄目なら選んでもらう)。
 */
async function copyText(s) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(s);
      return true;
    }
  } catch { /* 下の道へ落ちる */ }
  const ta = document.createElement('textarea');
  ta.value = s;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.top = '0';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, s.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch { ok = false; }
  ta.remove();
  return ok;
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || `${r.status}`);
  return body;
}

/**
 * 並び順だけ localStorage に覚える。**端末ごとに別で構わない** (読み方の縦/横と同じ立場)。
 * 絞り込みは覚えない — 次に開いた時に棚が勝手に減っていると、消えたのか絞られているのか
 * 分からない。並び順は何件出ているかを変えないので、覚えていても迷子にならない。
 */
const SORT_KEY = 'pinax.sort';
const SORTS = ['title', 'author', 'volumes', 'added', 'updated'];
function savedSort() {
  try {
    const v = localStorage.getItem(SORT_KEY);
    return SORTS.includes(v) ? v : 'title';
  } catch { return 'title'; }
}
function saveSort(v) {
  try { localStorage.setItem(SORT_KEY, v); } catch { /* 見られない端末でも棚は読めること自体は困らない */ }
}

/**
 * お気に入りも localStorage。**端末ごとに別** — 並び順と同じ立場。
 * 作品の id で持つ。id は再読込で変わらない (series は消さずに present を落とすだけ)
 */
const FAV_KEY = 'pinax.favorites';
const favs = (() => {
  try {
    const v = JSON.parse(localStorage.getItem(FAV_KEY) ?? '[]');
    return new Set(Array.isArray(v) ? v.filter(Number.isInteger) : []);
  } catch { return new Set(); }
})();
function toggleFav(id) {
  if (favs.has(id)) favs.delete(id); else favs.add(id);
  try { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); } catch { /* 覚えられないだけで、今の画面では効く */ }
  return favs.has(id);
}

const state = {
  q: '', gaps: false, behind: false, completed: undefined, needsCover: false, issues: false,
  care: false, sort: savedSort(),
};

/**
 * この端末で pinax が何をできるか。/api/health が**接続元ごとに**答える。
 * エクスプローラは pinax が動いている PC からしか開けないので、
 * スマホで見ている時はボタンそのものを出さない (押せるのに何も起きないのが一番困る)。
 */
const caps = { reveal: { available: false, reason: null } };

// ---- 棚 ----------------------------------------------------------------

function coverHtml(url, fallback) {
  return url
    ? `<img loading="lazy" src="${url}" alt="">`
    : `<span class="none">${esc(fallback)}</span>`;
}

function cardHtml(s) {
  const h = s.holdings[0];
  const badges = [];
  if (s.hasGap) badges.push(`<span class="badge gap">欠番 ${s.holdings.reduce((n, x) => n + x.missing.length, 0)}</span>`);
  // 手元の最大巻より先が出ている。**欠番とは意味が違う** ので別に出す
  if (s.shelf && s.shelf.aheadCount) badges.push(`<span class="badge ahead">+${s.shelf.aheadCount}</span>`);
  if (s.issues && s.issues.any) badges.push('<span class="badge warn">要確認</span>');
  // **何冊あるかは出さない。** 棚で要るのは「この作品に手を入れたい本がある」だけで、
  // 数まで並べると欠番の数字と札の数字が 2 つ並んで読み違える
  if (s.careFiles) badges.push('<span class="badge care">要ケア</span>');
  if (s.completed) badges.push('<span class="badge done">完</span>');
  const range = h ? `1〜${h.max}${h.unit}` : (s.looseFiles ? `${s.looseFiles}点` : '');
  return `<button class="card" data-id="${s.id}">
    <span class="cover">${coverHtml(s.coverUrl, s.title)}
      ${favs.has(s.id) ? '<span class="fav-mark" aria-label="お気に入り">★</span>' : ''}
      ${badges.length ? `<span class="badges">${badges.join('')}</span>` : ''}</span>
    <span class="c-title">${esc(s.title)}</span>
    <span class="c-meta">${esc(s.author ?? '著者不明')}${range ? ' · ' + range : ''}</span>
  </button>`;
}

async function loadGrid() {
  const p = new URLSearchParams({ sort: state.sort, limit: '500' });
  if (state.q) p.set('q', state.q);
  if (state.gaps) p.set('gaps', '1');
  if (state.behind) p.set('behind', '1');
  if (state.completed !== undefined) p.set('completed', state.completed ? '1' : '0');
  if (state.needsCover) p.set('needsCover', '1');
  if (state.issues) p.set('issues', '1');
  if (state.care) p.set('care', '1');

  const { total, items } = await api('/api/series?' + p);
  // お気に入りは先頭の段へ抜き出す。**下の棚には重ねて出さない**。
  // 絞り込みはそのまま効く — 絞った結果に入っていないお気に入りは段ごと出ない
  const fav = items.filter((s) => favs.has(s.id));
  const rest = items.filter((s) => !favs.has(s.id));
  $('favsec').hidden = fav.length === 0;
  $('favline').textContent = `お気に入り ${fav.length} 件`;
  $('favgrid').innerHTML = fav.map(cardHtml).join('');
  $('grid').innerHTML = rest.map(cardHtml).join('');
  $('empty').hidden = items.length > 0;
  const shown = rest.length;
  $('countline').textContent = state.behind
    ? `続きが出ている作品 ${shown} 件`
    : state.gaps
      ? `欠番のある作品 ${shown} 件`
      : state.issues
        ? `要確認の作品 ${shown} 件 — 同じ巻に複数のファイル、または何巻か読めないファイルがあります`
        : state.care
          ? `要ケアの本がある作品 ${shown} 件 — 壊れている・スキャンがひどい等、自分で印を付けたものです`
          : `${shown} 件を表示${total > shown ? ` (該当 ${total} 件)` : ''}`;
}

// ---- 詳細 ---------------------------------------------------------------

/**
 * 持っている 1 点分の板。**巻も合本も別巻も同じ形にする。**
 * どれも「持っている本」で、数直線に乗るかどうかしか違わない。
 * 片方をファイルの一覧で出すと、外伝だけ格下の置き場にあるように見える。
 *
 * **表紙を押すと読み始める。** 表紙は本そのものの絵なので、押して開くのがいちばん
 * 素直な入口。表紙の差し替えはその下のボタンへ回した (以前は逆だった)。
 *
 * サイズも保存も出さない。落とすのは下のファイル一覧から今まで通りできるし、
 * 読めるようになった今、板の上で要るのは**開く口と、絵を直す口**だけ。
 *
 * **操作は「···」1 つに畳む。** サムネ変更・巻ごとに分割・要ケアと増えた時、板ごとに
 * ボタンが 3 つ縦に積まれると、巻が 40 もある作品で棚が読めなくなる。中身は押した時に
 * 組み立てる (volMenuFor) ので、ここが持つのは**menu を開くのに要る印だけ**。
 *
 * `slot` は表紙の宛先で、詳細が返したものをそのまま持ち回る (src/cover-slot.ts)。
 * **画面では組み立てない** — 綴り方が 2 箇所に分かれた時点で、片方だけ直して繋がらなくなる。
 */
function volCardHtml(cover, label, files, opts = {}) {
  const tags = files.flatMap((x) => x.tags);
  // 1 枚の板に 2 本以上ぶら下がることがある (分割書庫・同じ巻の別版)。
  // **印はまとめて付け外しする** — 板の上に本は 1 冊しか見えていないので、
  // どちらか片方だけ立っている状態を作る口をここに置いても押しようが無い
  const ids = files.map((f) => f.id);
  const care = files.some((f) => f.care);
  const hasMenu = opts.slot !== undefined || opts.split !== undefined || ids.length > 0;
  return `<div class="vol${opts.cls ?? ''}${care ? ' care' : ''}">
    ${cover}
    <span class="lbl">${esc(label)}${tags.length ? ' ' + esc(tags.join(',')) : ''}</span>
    ${!hasMenu ? '' : `<button class="th dots" aria-label="${esc(label)}の操作" aria-expanded="false"
      data-menu-label="${esc(label)}"
      ${opts.slot === undefined ? '' : `data-cover-slot="${esc(opts.slot)}"`}
      ${opts.split === undefined ? '' : `data-split="${opts.split}"`}
      data-care-ids="${ids.join(',')}" data-care="${care ? '1' : '0'}">···</button>`}
  </div>`;
}

/**
 * 板の「···」を押した時に出す小さな品書き。**押した時に組み立てる** —
 * 巻が 40 ある作品で 40 枚ぶんの品書きを先に DOM へ置いても、ほとんど開かれない。
 *
 * 開いているのは常に 1 つ。次を開く時と、外を押した時と、板を貼り直す時に閉じる。
 */
let volMenuOpen = null;

function closeVolMenu() {
  if (!volMenuOpen) return;
  volMenuOpen.menu.remove();
  volMenuOpen.button.setAttribute('aria-expanded', 'false');
  volMenuOpen = null;
}

function openVolMenu(button) {
  const d = button.dataset;
  const label = d.menuLabel ?? '';
  const ids = (d.careIds ?? '').split(',').filter(Boolean).map(Number);
  const on = d.care === '1';

  const menu = document.createElement('div');
  menu.className = 'volmenu';
  const items = [];
  if (d.coverSlot !== undefined) {
    items.push(`<button data-act="cover">サムネ変更</button>`);
  }
  if (d.split !== undefined) {
    items.push(`<button data-act="split">巻ごとに分割</button>`);
  }
  if (ids.length) {
    items.push(`<button class="care" data-act="care">${on ? '要ケアを外す' : '要ケアにする'}</button>`);
  }
  menu.innerHTML = items.join('');

  const card = button.closest('.vol');
  card.appendChild(menu);
  /**
   * **右端の板では左へ伸ばす。** 板は 92px 幅で品書きは 148px あるので、
   * そのまま左端に合わせると最後の列で画面の外へ出て押せない。
   * 貼ってから実測する — 格子の列数は画面幅で変わるので、数えても当たらない
   */
  const box = menu.getBoundingClientRect();
  const limit = ($('detail') ?? document.documentElement).getBoundingClientRect().right;
  if (box.right > limit - 4) menu.classList.add('right');

  button.setAttribute('aria-expanded', 'true');
  volMenuOpen = { button, menu };

  menu.addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    closeVolMenu();
    if (b.dataset.act === 'cover') openPicker({ slot: d.coverSlot, label });
    else if (b.dataset.act === 'split') openSplit(Number(d.split), label);
    else await setCare(ids, !on);
  });
}

// 外を押したら閉じる。**capture で拾う** — 中身を貼り直す click より先に閉じないと、
// 消えた DOM を掴んだまま残る
document.addEventListener('click', (e) => {
  if (!volMenuOpen) return;
  const t = e.target instanceof Element ? e.target : null;
  if (t && (t.closest('.volmenu') || t.closest('.th.dots'))) return;
  closeVolMenu();
}, true);

/**
 * 表紙を「読む」入口にする。**分割書庫は先頭だけを開く** — 1 巻が 3 本に割れている時、
 * 中身は 1 冊分なので先頭を読めば足りる (続きが別の本に入っているものは実物に無い)
 */
const readCover = (files, inner, label) =>
  files.length
    ? `<button class="cover read" data-read="${files[0].id}" title="${esc(label)}を読む">${inner}</button>`
    : `<span class="cover">${inner}</span>`;

function volHtml(v) {
  const marks = [];
  if (v.duplicate) marks.push('<span class="badge warn">複</span>');
  // 人が付けた印。**機械の札より先に出す** — 自分で付けたものが一番早く目に入るべき
  if (v.files.some((f) => f.care)) marks.push('<span class="badge care">ケ</span>');
  if (v.coverPinned) marks.push('<span class="badge pinned">選</span>');
  if (v.completed) marks.push('<span class="badge done">完</span>');
  const inner = `${coverHtml(v.coverUrl, v.label)}
      ${marks.length ? `<span class="badges">${marks.join('')}</span>` : ''}`;
  return volCardHtml(readCover(v.files, inner, v.label), v.label, v.files, {
    cls: v.duplicate ? ' dup' : '',
    slot: v.coverSlot,
    /**
     * **合本にだけ出す。** 単巻に出しても割るものが無い。
     * 1 巻に 2 本以上ぶら下がっている時 (別版・分割書庫) も出さない —
     * どちらを割るのか機械には決められないし、片方だけ割ると重複が増える
     */
    split: v.volumeFrom !== v.volumeTo && v.files.length === 1 ? v.files[0].id : undefined,
  });
}

/**
 * 別巻 1 点の板。呼び名が空のものは作品そのものなので「本編」と書く。
 *
 * **巻の板と同じだけのことができる。** 絵は書誌から自動で取りに来るし
 * (bib/paste.ts)、呼び名が空のものは作品の代表表紙を借りて出る。取れなければ
 * 「サムネ変更」で選び直せる。以前は書影を巻数だけで引いていたので、番号を持たない
 * 別巻には絵の入る道そのものが無かった。
 *
 * **絵の代わりの文字は入れない。** 巻の板は表紙が無い時に巻数を書くが、呼び名は
 * すぐ下に出ているので、入れると「「メガドライブ ミニ」発売記念特別編」が
 * 毎回二度書きになる
 */
function sideVolHtml(s) {
  const label = s.label || '本編';
  const marks = [];
  if (s.files.some((f) => f.care)) marks.push('<span class="badge care">ケ</span>');
  if (s.coverPinned) marks.push('<span class="badge pinned">選</span>');
  const inner = `${coverHtml(s.coverUrl, '')}
      ${marks.length ? `<span class="badges">${marks.join('')}</span>` : ''}`;
  return volCardHtml(readCover(s.files, inner, label), label, s.files, { slot: s.coverSlot });
}

/**
 * 持っていない巻。**欠番と未購入を分けない。**
 *
 * 以前は「持っている範囲の穴」と「その先に出ている巻」を色と文字で分けていたが、
 * 見る側が知りたいのは「出ているのに持っていない」ことだけで、
 * それがどちらの理由かは要らない (本人の指定、2026-09-19)。
 */
function missingVolHtml(n, unit) {
  return `<div class="vol missing">
    <span class="cover"></span>
    <span class="lbl">第${String(n).padStart(2, '0')}${unit}</span>
  </div>`;
}

/**
 * 発行状況の一行。**「たぶん完結」とは書かない。**
 * 外の書誌に完結の情報が無いことは実測済みで、機械が断定して外すと買い逃しになる。
 * 分かっていることだけを出して、判断は人に委ねる。
 */
function shelfLineHtml(d) {
  const sh = d.shelf;
  const pub = d.published;
  if (!sh) return '';
  const src = pub && pub.providers && pub.providers.length ? pub.providers.join('・').toUpperCase() : '書誌';
  if (sh.status === 'unknown') {
    return `<div class="shelfline quiet">発行状況は未確認<small>「表紙を探して選ぶ」でシリーズを選ぶと分かります</small></div>`;
  }
  if (sh.status === 'behind') {
    return `<div class="shelfline">続きが出ています — 第${sh.ownedMax + 1}〜${sh.publishedMax}巻が未購入
      <small>${esc(src)} で確認できた範囲です。これより先が出ている可能性もあります</small></div>`;
  }
  if (sh.status === 'owner-completed') {
    // 完結と言っているのが誰かを必ず添える。フォルダの印なのか自分で指定したのかで、
    // 「本当に完結か」を疑う時の当たり先が変わる
    const by = sh.completedBy === 'user' ? 'この画面で指定' : 'フォルダの (完)';
    return `<div class="shelfline quiet">完結（${by}）${
      sh.missingCount ? ` — 未所持 ${sh.missingCount}巻` : ' — 揃っています'
    }<small>${esc(src)} で第${sh.publishedMax ?? '?'}巻まで確認</small></div>`;
  }
  return `<div class="shelfline quiet">${
    sh.latestYear ? `${sh.latestYear}年の第${sh.publishedMax}巻` : `第${sh.publishedMax}巻`
  }まで確認、それ以降は不明<small>完結したのか、書誌がまだ新刊を知らないのかは区別できません</small></div>`;
}

/**
 * 合本 (第01-02巻) を巻ごとのファイルに分ける。
 *
 * **押したら走り出す、にはしない。** 中がどう並んでいるかは開けてみないと分からず、
 * 分割できない合本 (ページがベタ連番) が必ず混ざる。先に中を見て、何が出来るかを
 * 見せてから押させる — 名前を直す紙 (.rnbox) と同じ二段。
 *
 * 進み具合は**この紙だけ貼り直す**。板ごと描き直すと 1 秒おきに画面が跳ねる。
 */
const splitter = { fileId: null, seriesId: null, label: '', plan: null, job: null, done: null, error: null };

const SPLIT_KIND = { nested: '中身が書庫', folders: '巻ごとのフォルダ', flat: 'ベタ連番' };

function splitClose() {
  Object.assign(splitter, { fileId: null, seriesId: null, label: '', plan: null, job: null, done: null, error: null });
}

function splitBoxHtml() {
  const s = splitter;
  // 別の作品を開いたら出さない。**紙は開いていた作品のもの**で、板と地続きに見えるので
  if (!s.fileId || !lastDetail || lastDetail.id !== s.seriesId) return '';
  const close = '<button class="mini" id="sp-close">閉じる</button>';

  if (s.done) {
    const clashes = s.plan ? s.plan.parts.filter((x) => x.clash).length : 0;
    return `<div class="spbox">
      <div class="sphead">分割しました${clashes ? ` <span class="spmeta">— ${clashes} 巻が既にある巻と被っています。下の「同じ巻に複数のファイル」で見比べてください</span>` : ''}</div>
      <div class="spplan">
        <div class="spfrom">${esc(s.done.from)}</div>
        ${s.done.made.map((n) => `<div class="spto">${esc(n)}</div>`).join('')}
      </div>
      <div class="spacts"><button class="btn go" id="sp-scan">この作品だけ再読込</button>${close}</div>
    </div>`;
  }

  if (s.error) {
    return `<div class="spbox">
      <div class="sphead">${esc(s.label)} を分割</div>
      <div class="spno"><div class="spwarn">分割できません</div>${esc(s.error)}</div>
      <div class="spacts">${close}</div>
    </div>`;
  }

  if (s.job) {
    const p = s.job.progress;
    const line = p
      ? `${p.phase} ${p.part}/${p.parts} ${p.label}${p.pages ? ` ${p.page}/${p.pages}` : ''}`
      : '始めています';
    return `<div class="spbox">
      <div class="sphead">${esc(s.label)} を分割</div>
      <div class="spwork"><span class="spin"></span>${esc(line)}</div>
    </div>`;
  }

  if (!s.plan) {
    return `<div class="spbox">
      <div class="sphead">${esc(s.label)} を分割</div>
      <div class="spwork"><span class="spin"></span>中を見ています</div>
    </div>`;
  }

  const meta = `<span class="spmeta">— ${s.plan.format} / ${SPLIT_KIND[s.plan.kind]}`
    + `${s.plan.pages ? ` / ${s.plan.pages} ページ` : ''}</span>`;
  const head = `<div class="sphead">${esc(s.label)} を分割 ${meta}</div>`;

  if (!s.plan.ok) {
    return `<div class="spbox">${head}
      <div class="spno"><div class="spwarn">分割できません</div>${esc(s.plan.reason)}</div>
      <div class="spacts">${close}</div>
    </div>`;
  }

  return `<div class="spbox">${head}
    <div class="spplan">
      <div class="spfrom">${esc(s.plan.from)}</div>
      ${s.plan.parts.map((x) => `<div class="spto">${esc(x.name)}
        ${x.pages ? `<span class="spmeta">${x.pages} ページ</span>` : ''}
        ${x.clash ? `<span class="spclash">同じ巻が既にあります (${esc(x.clash)})。
          (2) を付けて置くので、割った後に中を見比べて残す方を選べます</span>` : ''}</div>`).join('')}
    </div>
    <div class="spacts"><button class="btn go" id="sp-go">分割する</button>${close}</div>
  </div>`;
}

function renderSplitBox() {
  const box = $('splitbox');
  if (!box) return;
  box.innerHTML = splitBoxHtml();
  $('sp-close')?.addEventListener('click', () => { splitClose(); renderSplitBox(); });
  // 読み直すのは**割った作品だけ。** 全根スキャンは NAS だと数十秒かかるので、
  // 1 作品を棚へ載せ直すためにそれを待たせない (rescanSeries)
  $('sp-scan')?.addEventListener('click', (e) => rescanSeries(splitter.seriesId, e.currentTarget));
  $('sp-go')?.addEventListener('click', splitGo);
}

async function openSplit(fileId, label) {
  // 走っている最中は閉じない。押し間違いで進み具合を見失わないように
  if (splitter.fileId === fileId && !splitter.job) { splitClose(); renderSplitBox(); return; }
  if (splitter.job) return;
  splitClose();
  splitter.fileId = fileId;
  splitter.seriesId = lastDetail ? lastDetail.id : null;
  splitter.label = label;
  renderSplitBox();
  try {
    splitter.plan = await api(`/api/files/${fileId}/split`);
  } catch (e) {
    splitter.error = e.message;
  }
  renderSplitBox();
}

async function splitGo() {
  const id = splitter.fileId;
  try {
    await api(`/api/files/${id}/split`, { method: 'POST' });
  } catch (e) {
    toast('できません: ' + e.message, 6000);
    return;
  }
  splitter.job = { running: true, progress: null };
  renderSplitBox();
  void splitWatch(id);
}

/** 終わるまで見に行く。**画面を離れたら (fileId が変わったら) 降りる** */
async function splitWatch(id) {
  while (splitter.fileId === id && splitter.job) {
    await new Promise((r) => setTimeout(r, 900));
    if (splitter.fileId !== id) return;
    let st;
    try {
      st = await api(`/api/files/${id}/split/status`);
    } catch (e) {
      splitter.job = null;
      splitter.error = e.message;
      renderSplitBox();
      return;
    }
    if (st.running) {
      splitter.job = st;
      renderSplitBox();
      continue;
    }
    splitter.job = null;
    if (st.error) splitter.error = st.error;
    else {
      splitter.done = st.result;
      toast(`${st.result.made.length} 本に分割しました`, 5000);
    }
    renderSplitBox();
    // 被った巻があれば**そのまま読み直して見比べる所まで連れて行く。**
    // 読み直さないと (2) の方が棚に載らず、見比べる相手が居ない
    if (splitter.done && splitter.plan?.parts.some((x) => x.clash)) {
      await rescanSeries(splitter.seriesId, $('sp-scan'));
      $('dupsec')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    return;
  }
}

/**
 * その作品のフォルダだけ読み直す。**全根スキャンと同じことを、歩く量だけ減らしてやる。**
 *
 * 棚のファイルは pinax の外でも動く (合本を割った直後、手で巻を足した時)。
 * 定期スキャンは既定で 3 時間おきなので、そこまで待てない時の道がここ。
 * 押した所に戻って板を貼り直すので、押した人は結果をその場で見られる。
 */
async function rescanSeries(id, button) {
  const was = button ? button.textContent : '';
  if (button) { button.disabled = true; button.innerHTML = '<span class="spin"></span> 再読込中'; }
  try {
    const { results } = await api(`/api/series/${id}/rescan`, { method: 'POST' });
    const bad = results.find((r) => r.error);
    if (bad) toast(bad.error, 6000);
    else {
      // フォルダが 2 つに散っている作品では 2 本返る。**足して 1 行で言う**
      const seen = results.reduce((n, r) => n + r.filesSeen, 0);
      const added = results.reduce((n, r) => n + r.volumesAdded, 0);
      const gone = results.reduce((n, r) => n + r.gone, 0);
      const bits = [`${seen} ファイル`, `巻 +${added}`];
      // **消えた分も言う。** 割った後の原本のように、減る方が本題のことがある
      if (gone) bits.push(`消えた ${gone}`);
      toast(bits.join(' / '), 5000);
    }
    await Promise.all([loadGrid(), loadNews(), loadStats()]);
    // 開いたままの板は貼り直さないと古いまま。**読み直しても中身が変わらない**所だった
    if (sheetOpen() && lastDetail && lastDetail.id === id) await openDetail(id, 'keep');
  } catch (e) {
    toast('失敗: ' + e.message, 5000);
  }
  if (button) { button.disabled = false; button.textContent = was; }
}

function detailHtml(d) {
  const bib = d.bib ?? {};
  const gapText = d.holdings
    .filter((h) => h.missing.length)
    .map((h) => `${h.unit}: ${h.missing.join(', ')}`)
    .join(' / ');

  // 持っている巻と欠番を 1 本の数直線に並べる。歯抜けが目で見える形にする
  const main = d.holdings.find((h) => h.unit === '巻') ?? d.holdings[0];
  // 数直線の 1 マスに置くのは単巻だけ。**合本 (第01-02巻) を同じ Map に混ぜてはいけない** —
  // 単巻の第01巻と合本の第01-02巻を両方持っている時、後から入れた合本が単巻を
  // 押し出して、単巻の方が画面から消える
  const owned = new Map();
  for (const v of d.volumes) {
    if (main && v.unit !== main.unit) continue;
    if (v.volumeFrom !== v.volumeTo) continue;
    owned.set(v.volumeFrom, v);
  }
  /**
   * 合本を「始まりの巻」の位置に差し込むための索引。
   *
   * 後ろへ回すと 3, 4, 6, 1-2, 5-7 と並んで、どこの巻なのか目で追えなくなる。
   * 始まりで並べれば 1-2, 3, 4, 5-7, 6 になり、数直線としてまだ読める
   * (5-7 と 6 のように前後するのは、重なっている巻を持っている時だけ)。
   *
   * 同じ巻から始まる合本が複数あるときは、狭い方を先に出す
   */
  const spans = new Map();
  for (const v of d.volumes) {
    if (main && v.unit !== main.unit) continue;
    if (v.volumeFrom === v.volumeTo) continue;
    spans.set(v.volumeFrom, [...(spans.get(v.volumeFrom) ?? []), v]);
  }
  for (const at of spans.values()) at.sort((a, b) => a.volumeTo - b.volumeTo);
  const line = [];
  // 数直線に描いた巻。後ろに足す時、同じ巻を二度出さないための印
  const placed = new Set();
  if (main) {
    /**
     * **手元の最大巻で数直線を止めない。** 外の書誌が知っている巻まで伸ばす。
     * 止めてしまうと「1〜10巻が揃っている」ように見えて、19巻まで出ていることに
     * 一生気付けない — 蔵書管理として一番まずい見え方になる。
     */
    const pub = d.published ?? { max: null, known: [] };
    const knownSet = new Set(pub.known ?? []);
    const last = main.unit === '巻' && pub.max ? Math.max(main.max, pub.max) : main.max;
    for (let i = 1; i <= last; i++) {
      // 同じ巻から始まる単巻と合本は、単巻 → 合本 の順に並べる
      const here = [owned.get(i), ...(spans.get(i) ?? [])].filter(Boolean);
      if (here.length) {
        for (const v of here) { line.push(volHtml(v)); placed.add(v.id); }
        continue;
      }
      // 合本の途中の番号。その巻は始まりの位置で合本 1 枚として出ているので、ここでは欠番にしない
      if (d.volumes.some((x) => x.unit === main.unit && x.volumeFrom <= i && x.volumeTo >= i)) continue;
      // 手元の最大巻より先は、**書誌が知っている番号だけ**出す (あるとは限らない)
      if (i > main.max) { if (knownSet.has(i)) line.push(missingVolHtml(i, main.unit)); }
      else line.push(missingVolHtml(i, main.unit));
    }
    // 数直線に乗らなかった巻を後ろに足す — 別単位の巻
    // (巻で数える作品に 1 つだけ混ざった「第224話」など)。
    // **ここで落とすと、持っているのに画面から消える**
    for (const v of d.volumes) if (!placed.has(v.id)) line.push(volHtml(v));
  } else {
    for (const v of d.volumes) line.push(volHtml(v));
  }

  return `
  <div class="d-head">
    <div class="d-cover">${coverHtml(d.coverUrl, d.title)}</div>
    <div class="d-info">
      <div class="d-titlerow">
        <h2>${esc(d.title)}${d.completed ? ' <span class="badge done">完結</span>' : ''}</h2>
        <button class="fav${favs.has(d.id) ? ' on' : ''}" id="fav" aria-pressed="${favs.has(d.id)}"
          aria-label="お気に入り">${favs.has(d.id) ? '★' : '☆'}</button>
      </div>
      <div class="d-author">${esc(d.author ?? '著者不明')}</div>
    </div>
  </div>
  ${d.volumes.length ? `<h3 class="sec">巻 <span style="font-weight:400">— 表紙を押すと読み始めます</span></h3>
  <div class="vols">${line.join('')}</div>` : ''}
  <div id="splitbox">${splitBoxHtml()}</div>
  ${sideSectionHtml(d)}
  ${careSectionHtml(d)}
  ${dupSectionHtml(d)}
  ${d.loose.length ? `<h3 class="sec">巻数も呼び名も読めなかったファイル</h3>
    <div class="filelist">${d.loose.map((f) => fileRowHtml(f)).join('')}</div>` : ''}
  <h3 class="sec">この作品について</h3>
  <div class="d-about">
    <dl class="kv">
      <dt>所持</dt><dd>${d.fileCount} 冊 · ${mb(d.bytes)}${d.looseFiles ? ` (巻数不明 ${d.looseFiles} 点)` : ''}</dd>
      ${bib.publisher ? `<dt>出版</dt><dd>${esc(bib.publisher)}${bib.pubdate ? ` (${esc(bib.pubdate)})` : ''}</dd>` : ''}
      ${bib.isbn ? `<dt>ISBN</dt><dd>${esc(bib.isbn)}</dd>` : ''}
      <dt>フォルダ</dt><dd>${esc(d.folder)}</dd>
    </dl>
    ${gapText ? `<div class="gapline">欠番 ${esc(gapText)}</div>` : ''}
    ${shelfLineHtml(d)}
    ${issueLineHtml(d)}
    ${completedSwitchHtml(d)}
    ${pickLineHtml(d)}
    <div class="d-actions">
      <button class="btn" id="pick-open">表紙を探して選ぶ</button>
      <button class="btn" id="rn-open">名前を直す</button>
      ${caps.reveal.available ? '<button class="btn pc-only" id="reveal">エクスプローラで開く</button>' : ''}
      <button class="btn" id="rescan">この作品だけ再読込</button>
    </div>
    ${renameBoxHtml(d)}
  </div>
  `;
}

/**
 * 要確認の一行。**「直しました」ではなく「ここが怪しい」までしか言わない。**
 * 別版として両方置いているのか捨て漏れなのかは中身を見た人しか決められない。
 */
function issueLineHtml(d) {
  const is = d.issues;
  if (!is || !is.any) return '';
  const parts = [];
  if (is.duplicateVolumes) parts.push(`同じ巻に複数のファイル ${is.duplicateVolumes}巻 (余分 ${is.duplicateFiles}点)`);
  if (is.unreadableFiles) parts.push(`何巻か読めないファイル ${is.unreadableFiles}点`);
  return `<div class="issueline">要確認 — ${esc(parts.join(' / '))}
    <small>どれを残すかは中身を見て決めてください。pinax はファイルを消しません</small></div>`;
}

/**
 * 今どの書誌シリーズを見ているか。
 *
 * **選んでいない時は何も出さない。** 9 割の作品は自動で当たっていて、
 * そこに毎回「自動です」と書いても場所を食うだけ。出すのは人が選んだ時だけにして、
 * 「これは自分で決めたものだ」と分かるようにする。
 */
function pickLineHtml(d) {
  if (!d.pick) return '';
  const src = { ndl: 'NDLサーチ', rakuten: '楽天ブックス', google: 'Google Books' }[d.pick.scope] ?? '全部';
  return `<div class="pk-now">選んだシリーズ: ${esc(d.pick.title)}
    <span class="pk-tag">${esc(src)}</span>
    <button class="mini" id="pick-clear" style="margin-left:auto">自動に戻す</button>
    <small>この作品は書名から自動で当てず、この系列だけを見ます</small></div>`;
}

/**
 * 完結の入り / 切り。
 *
 * まだ触っていない作品はフォルダ名の `(完)` の答えがそのまま入っている。
 * 触った時だけ人の指定として別の列に残る (フォルダ名は書き換えない) ので、
 * 添え書きで**今どちらを見ているか**だけ知らせる。
 */
function completedSwitchHtml(d) {
  const note = d.completedUser !== null
    ? '手で指定'
    : d.folderCompleted ? 'フォルダ名の (完) から' : '';
  return `<div class="setrow">
    <label class="switch">
      <input type="checkbox" id="sw-completed"${d.completed ? ' checked' : ''}>
      <span class="track"></span>
      <span>完結済み</span>
    </label>
    ${note ? `<span class="setnote">${note}</span>` : ''}
  </div>`;
}

/**
 * 作品フォルダの名前を直す欄。
 *
 * **押した時だけ開く。** 普段の作業ではまず触らないので、畳んでおかないと
 * 「完結」「表紙を選ぶ」のような毎日使うものが押しにくくなる。
 *
 * 状態を detailHtml の外に置いているのは、詳細の中身を貼り直しても
 * 打ちかけの名前が消えないようにするため (表紙を選ぶ画面と同じ作り)。
 */
const renamer = {
  seriesId: null, open: false, title: '', author: '', completed: false, plan: null, fromPick: false,
};

/**
 * **表紙で選んだシリーズがあれば、そちらを既定値にする。**
 *
 * 名前を直しに来る作品は、棚のフォルダ名が間違っているから来る。正しい書名と著者は
 * たいてい「表紙を探して選ぶ」で人が既に当てていて、画面にも出ている。そこで棚の
 * 名前を出し直すと、**当てた答えを見ながらもう一度打ち写す**ことになる。
 *
 * 著者は、選択を付けた時期によっては控えていない (series_pick.author は後から
 * 足した列)。その時だけ棚の値に落ちる。
 */
function renameOpen(d) {
  renamer.seriesId = d.id;
  renamer.open = true;
  renamer.title = d.pick ? d.pick.title : d.title;
  renamer.author = (d.pick && d.pick.author) || d.author || '';
  renamer.fromPick = Boolean(d.pick);
  renamer.completed = d.completed;
  renamer.plan = null;
}

function renameClose() {
  renamer.open = false;
  renamer.plan = null;
}

/** 欄の中身を読み取って控える。貼り直しで打ちかけを失わないため */
function renameCollect() {
  const t = $('rn-title'); const a = $('rn-author'); const c = $('rn-completed');
  if (t) renamer.title = t.value;
  if (a) renamer.author = a.value;
  if (c) renamer.completed = c.checked;
}

/**
 * 計画の中身。**出すのは「どうなるか」だけ。**
 *
 * ファイル 1 本ずつの新旧は並べない — 付け替え方は全部同じなので、4 点でも 200 点でも
 * 同じ形が縦に伸びるだけで、読むところが無い。代わりに**追従できないファイルは
 * 名前で出す**。あれは人が手で直しに行く先で、名前が分からないと直せない。
 */
function renamePlanHtml(p) {
  if (p.noop) {
    return `<div class="rnplan"><div class="rnfrom">${esc(p.from)}</div>
      <div class="rnto">名前は変わりません</div></div>`;
  }
  // フォルダ名は合っていてファイル名だけ直す付け替えもある (外で直した後がこの形)
  const head = p.from === p.to
    ? `<div class="rnto">${esc(p.to)} <span class="rnsame">— フォルダ名はこのまま</span></div>`
    : `<div class="rnfrom">${esc(p.from)}</div><div class="rnto">→ ${esc(p.to)}</div>`;
  return `<div class="rnplan">
    ${head}
    ${p.warnings.map((w) => `<div class="rnwarn">${esc(w)}</div>`).join('')}
    ${p.moves.length
      ? `<small>このフォルダ以下 ${p.moves.length} 件のファイル名も追従させます</small>`
      : '<small>ファイル名は既に揃っています</small>'}
    ${p.stuck.length ? `<div class="rnstuck">
      このフォルダ以下の、作品名が前置きになっていない下記ファイルは追従できません
      <ul>${p.stuck.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>
    </div>` : ''}
  </div>`;
}

function renameBoxHtml(d) {
  if (!renamer.open || renamer.seriesId !== d.id) return '';
  const p = renamer.plan;
  // 計画が出ていて、名前が実際に変わる時だけ「付け替える」を出す。
  // **見る前に押せる形にしない** — どう変わるか見ずに棚を動かせてしまう
  const canGo = p && !p.noop;
  return `<div class="rnbox">
    <div class="rnrow">
      <label class="fld">作品名
        <input type="text" id="rn-title" value="${esc(renamer.title)}" placeholder="正しい作品名"></label>
      <label class="fld">著者
        <input type="text" id="rn-author" value="${esc(renamer.author)}" placeholder="著者 (空でも可)"></label>
    </div>
    ${renamer.fromPick
      ? `<div class="rnfrom-pick">選んだシリーズから写しました — 棚の名前は「${esc(d.folder)}」です</div>`
      : ''}
    <label class="switch">
      <input type="checkbox" id="rn-completed"${renamer.completed ? ' checked' : ''}>
      <span class="track"></span>
      <span>完結済み — フォルダ名に (完) を書く</span>
    </label>
    ${p ? renamePlanHtml(p) : ''}
    <div class="rnacts">
      <button class="btn" id="rn-plan">${p ? 'もう一度見る' : 'どう変わるか見る'}</button>
      ${canGo ? '<button class="btn go" id="rn-go">この名前に付け替える</button>' : ''}
      <button class="mini" id="rn-cancel">やめる</button>
    </div>
    <small class="rnnote">ここから直すと焼いた表紙も選んだシリーズも完結の指定も残ります。
      エクスプローラで直すと別の作品として登録し直されて、全部消えます</small>
  </div>`;
}

/**
 * ファイル 1 本の行。保存と、要ケアの付け外しと、PC なら置き場所を開く口を添える。
 *
 * **ここは畳まない。** 板と違って 1 行 = ファイル 1 本なので、押す先が曖昧にならない。
 * 同じ巻に別版が 2 本ある時、どちらがひどいのかを言えるのはこの一覧だけ
 */
function fileRowHtml(f) {
  return `<div class="row">
    <span class="nm"><a href="/api/files/${f.id}/download">${esc(f.relPath)}</a></span>
    <span class="sz">${mb(f.size)}</span>
    <button class="mini${f.care ? ' care-on' : ''}" data-care-file="${f.id}"
      data-care="${f.care ? '1' : '0'}">要ケア</button>
    ${caps.reveal.available ? `<button class="mini pc-only" data-reveal-file="${f.id}">場所</button>` : ''}
  </div>`;
}

/**
 * 巻ではない収録物を並べる。外伝・特別編と、1 冊で完結している作品。
 *
 * **要確認には出さない。** 巻数が付いていないのが正しいものなので、人に直す先が無い。
 *
 * 板は巻と同じ形にしてあるが、**節は分ける。** 同じ並びに混ぜると番号の無い板が
 * 「第 n 巻」の列に割り込んで、数えていないものを数えているように見える
 */
function sideSectionHtml(d) {
  if (!d.side || !d.side.length) return '';
  return `<h3 class="sec">別巻 <span style="font-weight:400">— 巻には数えていません</span></h3>
  <div class="vols">${d.side.map(sideVolHtml).join('')}</div>`;
}

/**
 * 印の付いた本を集める。**板の並びの順に拾う** — 巻 → 別巻 → 巻数不明 で、
 * 上の数直線をそのまま下へ写した形になる。
 */
function careItems(d) {
  const out = [];
  for (const v of d.volumes) for (const f of v.files) if (f.care) out.push({ label: v.label, f });
  for (const s of d.side) for (const f of s.files) if (f.care) out.push({ label: s.label || '本編', f });
  for (const f of d.loose) if (f.care) out.push({ label: '巻数不明', f });
  return out;
}

/**
 * 要ケアの本を並べる節。**メモを書くのはここ 1 箇所。**
 *
 * 板の下に入力欄をぶら下げると格子の行が丸ごと伸びて並びが崩れる。印の付いた本だけを
 * 1 節にまとめれば、そこが「あとから拾う」時に見る場所そのものになる。
 *
 * **要確認とは別の節にする。** 要確認は機械が気付いた綻びで、直せないものも混ざる。
 * ここに並ぶのは全部、自分で中を見て印を付けたものだけ。
 */
function careSectionHtml(d) {
  const items = careItems(d);
  if (!items.length) return '';
  return `<h3 class="sec">要ケア <span style="font-weight:400">— ${items.length} 冊</span></h3>
  <div class="carebox">
    ${items.map(({ label, f }) => `<div class="carerow">
      <div class="hd"><b>${esc(label)}</b><span class="nm">${esc(f.relPath)}</span>
        <button class="mini" data-care-file="${f.id}" data-care="1">外す</button></div>
      <input type="text" data-care-note="${f.id}" value="${esc(f.careNote ?? '')}"
        placeholder="どうしたい？ (空でも可)">
    </div>`).join('')}
    <div class="carenote-hint">メモは打った端から残ります。外してもメモは消えません</div>
  </div>`;
}

/**
 * 「ケアが必要」の印を立てる / 外す。**ファイル 1 本ずつ投げる** — 1 枚の板に 2 本
 * ぶら下がっていても、DB の単位はファイルのままにしておく (db.ts の files.care)。
 *
 * 押した後は板も棚も貼り直す。板の札 (ケ) と棚の札 (要ケア) が同じ印を見ているので、
 * 片方だけ直すと「付けたのに棚では分からない」という見え方になる。
 */
async function setCare(ids, on) {
  try {
    for (const id of ids) {
      await api(`/api/files/${id}/care`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ care: on }),
      });
    }
    toast(on ? '要ケアにしました' : '要ケアを外しました');
    if (readerOpen() && ids.includes(reader.fileId)) rdSetCare(on);
    if (lastDetail) await openDetail(lastDetail.id, 'keep');
    await loadGrid();
  } catch (e) {
    toast('失敗: ' + e.message, 5000);
  }
}

/**
 * メモだけ書き直す。**貼り直さない** — 打っている最中に中身を差し替えると
 * 入力欄から指が離れる。印そのものは動かないので、画面で直すところも無い。
 */
async function saveCareNote(id, note) {
  try {
    await api(`/api/files/${id}/care`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ care: true, note }),
    });
    // 貼り直さないぶん、控えの方も合わせておく (次に貼り直した時に打った内容が戻らないように)
    if (lastDetail) {
      for (const { f } of careItems(lastDetail)) if (f.id === id) f.careNote = note.trim() || null;
    }
  } catch (e) {
    toast('メモを残せませんでした: ' + e.message, 5000);
  }
}

/**
 * 同じ巻に複数のファイルがある巻を、**中身を並べて**見せる。多い作品があるので頭から 12 巻だけ。
 *
 * 以前はファイル名の一覧だけで、どちらを残すかはエクスプローラで両方を解凍して
 * 見比べるしかなかった。合本を割った時に単巻と被るのが一番よく起きる形 (split.ts の clash)。
 * 絵は開いた後に 1 本ずつ取りに行く (loadCompares) — 索引は rar だと 1 冊 1 秒前後かかる
 */
function dupSectionHtml(d) {
  const dups = d.volumes.filter((v) => v.duplicate);
  if (!dups.length) return '';
  const shown = dups.slice(0, 12);
  return `<h3 class="sec" id="dupsec">同じ巻に複数のファイル <span style="font-weight:400">— 中を見比べて残す方を選べます</span></h3>
  <div class="cmps">
    ${shown.map(dupCompareHtml).join('')}
    ${dups.length > shown.length ? `<div class="more">ほか ${dups.length - shown.length} 巻</div>` : ''}
  </div>`;
}

/** 同じ巻のファイルを「1 本分」ずつに束ねる。分割書庫の続きは 1 本と数える (catalog.ts の fileBaseOf) */
function fileGroups(files) {
  const by = new Map();
  for (const f of files) {
    const key = f.relPath.replace(/(\.part\d+)?\.[^.\\/]+$/i, '');
    const acc = by.get(key) ?? [];
    acc.push(f);
    by.set(key, acc);
  }
  return [...by.values()].map((g) => g.slice().sort((a, b) => (a.partNo ?? 0) - (b.partNo ?? 0)));
}

function dupCompareHtml(v) {
  return `<div class="cmp">
    <b class="cmphead">${esc(v.label)}</b>
    <div class="cmpcols">${fileGroups(v.files).map(cmpColHtml).join('')}</div>
    <div class="cmpnote" hidden></div>
  </div>`;
}

/** 1 本分の列。**残すのはこの 1 本 (分割書庫なら続きも) で、同じ巻の他は全部 attic へ引く** */
function cmpColHtml(files) {
  const f = files[0];
  const size = files.reduce((n, x) => n + x.size, 0);
  return `<div class="cmpcol" data-cmp-file="${f.id}">
    <div class="filelist">${files.map(fileRowHtml).join('')}</div>
    <div class="cmpmeta"><b>${mb(size)}</b> · <span class="cmppages">ページ数を数えています</span></div>
    <div class="cmpthumbs"><span class="spwork"><span class="spin"></span>中を見ています</span></div>
    <div class="spacts">
      <button class="mini" data-read="${f.id}">読む</button>
      <button class="btn go" data-keep="${f.id}">これを残す</button>
    </div>
  </div>`;
}

/** 見比べに出すページ。頭の 3 枚と真ん中と最後 — 表紙の違いと、途中や末尾の欠けが見える */
function cmpPicks(n) {
  return [...new Set([0, 1, 2, Math.floor(n / 2), n - 1])].filter((i) => i >= 0 && i < n).sort((a, b) => a - b);
}

/**
 * 見比べの列に絵とページ数を入れる。**1 本ずつ順に**聞く — 並べて投げても
 * 向こうで rar の索引作りが詰まるだけで、どの列も埋まらない時間が長くなる。
 * 板を貼り直したら (列が DOM から消えたら) 降りる
 */
async function loadCompares() {
  const cols = [...$('detail').querySelectorAll('.cmpcol[data-cmp-file]')];
  for (const col of cols) {
    if (!col.isConnected) return;
    const id = Number(col.dataset.cmpFile);
    const thumbs = col.querySelector('.cmpthumbs');
    const pages = col.querySelector('.cmppages');
    let ix;
    try {
      ix = await api(`/api/files/${id}/pages`);
    } catch (e) {
      pages.textContent = 'ページ数不明';
      thumbs.innerHTML = `<span class="spmeta">開けません: ${esc(e.message)}</span>`;
      continue;
    }
    if (!col.isConnected) return;
    col.dataset.pages = String(ix.count);
    pages.textContent = `${ix.count} ページ`;
    thumbs.innerHTML = ix.count
      ? cmpPicks(ix.count).map((i) => `<span class="cmpthumb">
          <img src="/api/files/${id}/page/${i}" alt="${i + 1} ページ目" loading="lazy">${i + 1}</span>`).join('')
      : `<span class="spmeta">${ix.nested ? '中身が書庫なので、ここでは絵を出せません' : '絵が見つかりません'}</span>`;
  }
  // ページ数が違う巻は言う。欠けのある方を捨てたい時に一番効く手がかり
  for (const cmp of $('detail').querySelectorAll('.cmp')) {
    const counts = [...cmp.querySelectorAll('.cmpcol')].map((c) => c.dataset.pages).filter((n) => n !== undefined);
    const note = cmp.querySelector('.cmpnote');
    if (note && new Set(counts).size > 1) {
      note.hidden = false;
      note.textContent = `ページ数が違います (${counts.join(' / ')})`;
    }
  }
}

/** 選んだ 1 本を残して、同じ巻の他を attic へ引く。**消さない**ので、間違えても attic から戻せる */
async function keepFile(seriesId, fileId, button) {
  const col = button.closest('.cmpcol');
  const others = [...button.closest('.cmp').querySelectorAll('.cmpcol')].filter((c) => c !== col).length;
  const name = col.querySelector('.nm')?.textContent.trim().split(/[\\/]/).pop() ?? '';
  if (!confirm(`「${name}」を残して、ほかの ${others} 本を data/attic へ移します。\n\nよろしいですか?`)) return;
  button.disabled = true;
  button.innerHTML = '<span class="spin"></span> 移しています';
  try {
    const r = await api(`/api/series/${seriesId}/keep`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ keep: fileId }),
    });
    toast(`${r.kept} を残しました${r.renamed ? ' (名前の (2) を外しました)' : ''}`, 5000);
    await Promise.all([loadGrid(), loadNews(), loadStats()]);
    if (sheetOpen() && lastDetail && lastDetail.id === seriesId) await openDetail(seriesId, 'keep');
  } catch (e) {
    toast('できません: ' + e.message, 6000);
    button.disabled = false;
    button.textContent = 'これを残す';
  }
}

/**
 * 詳細を開く。
 *
 * **履歴を 1 つ積んでから開く。** Android の戻るでモーダルだけが閉じるようにするため。
 * 以前は `location.hash` を書き換えるだけだったので、戻るの 1 回目は URL が変わるだけで
 * モーダルが開いたまま残り、2 回目で pinax そのものから出ていた。
 *
 *   mode 'push'  … 棚から開いた。戻るで閉じられる
 *   mode 'entry' … `#/series/5` を直接開いた。積むものが無いので置き換える
 *                  (この時だけは戻るで pinax を出る — それが正しい戻り先)
 *   mode 'keep'  … 中身の貼り直し。履歴もスクロール位置も動かさない
 */
let lastDetail = null;

async function openDetail(id, mode = 'push') {
  const refresh = mode === 'keep';
  if (!refresh) {
    $('detail').innerHTML = '<div class="empty"><span class="spin"></span> 読み込み中</div>';
    $('sheet-title').textContent = '読み込み中';
  }
  showSheet();
  const url = '#/series/' + id;
  if (mode === 'push') history.pushState({ sheetId: id }, '', url);
  else if (mode === 'entry') history.replaceState({ sheetId: id, entry: true }, '', url);

  const top = $('detail').scrollTop;
  const d = await api('/api/series/' + id);
  lastDetail = d;
  $('sheet-title').textContent = d.label || d.title;
  $('detail').innerHTML = detailHtml(d);
  $('detail').scrollTop = refresh ? top : 0;
  wireDetail(d);
}

/** 詳細の中のボタンを繋ぐ。中身を貼り直すたびに呼ぶ */
function wireDetail(d) {
  const id = d.id;

  // お気に入り。端末の中だけで済むので、押したらすぐ棚も組み直す
  $('fav')?.addEventListener('click', (e) => {
    const b = e.currentTarget;
    const on = toggleFav(id);
    b.classList.toggle('on', on);
    b.textContent = on ? '★' : '☆';
    b.setAttribute('aria-pressed', String(on));
    loadGrid();
  });

  // 完結の入り / 切り
  $('sw-completed')?.addEventListener('change', async (e) => {
    const el = e.currentTarget;
    const value = el.checked;
    el.disabled = true;
    try {
      await api(`/api/series/${id}/completed`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ completed: value }),
      });
      toast(value ? '完結にしました' : '完結を外しました');
      await openDetail(id, 'keep');
      await loadGrid();
    } catch (err) {
      toast('失敗: ' + err.message, 5000);
      el.checked = !value;  // 通らなかったのに入ったままにしない
      el.disabled = false;
    }
  });

  // 表紙を探して選ぶ。**作品まるごとの入口はここ。**
  // 巻 1 つぶんは板の「···」の中 (openVolMenu)
  $('pick-open')?.addEventListener('click', () => openPicker(null));

  // この作品のフォルダだけ読み直す。分割の紙からも同じ所へ来る (renderSplitBox)
  $('rescan')?.addEventListener('click', (e) => rescanSeries(id, e.currentTarget));

  // 板の操作は「···」1 つに畳んである。サムネ変更・巻ごとに分割・要ケアは全部この中
  closeVolMenu();
  $('detail').querySelectorAll('button.th.dots').forEach((b) => {
    b.addEventListener('click', () => {
      const same = volMenuOpen && volMenuOpen.button === b;
      closeVolMenu();
      if (!same) openVolMenu(b);
    });
  });

  // 合本を巻ごとに分ける。**下見を見てから押す**二段 (splitBoxHtml)
  renderSplitBox();

  // ファイル 1 本ずつの要ケア。一覧の行と、要ケアの節の「外す」が同じ道を通る
  $('detail').querySelectorAll('button[data-care-file]').forEach((b) => {
    b.addEventListener('click', () => setCare([Number(b.dataset.careFile)], b.dataset.care !== '1'));
  });

  // メモ。**打ち終わりを待ってから送る** (1 文字ごとに投げない)
  $('detail').querySelectorAll('input[data-care-note]').forEach((el) => {
    let timer = null;
    const flush = () => {
      clearTimeout(timer);
      timer = null;
      saveCareNote(Number(el.dataset.careNote), el.value);
    };
    el.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(flush, 600); });
    // 板を閉じる時に打ちかけを落とさない
    el.addEventListener('blur', () => { if (timer) flush(); });
  });

  // 表紙を押したら読み始める
  $('detail').querySelectorAll('button[data-read]').forEach((b) => {
    b.addEventListener('click', () => openReader(Number(b.dataset.read)));
  });

  // 同じ巻の見比べ。絵は貼った後に取りに行く
  $('detail').querySelectorAll('button[data-keep]').forEach((b) => {
    b.addEventListener('click', () => keepFile(id, Number(b.dataset.keep), b));
  });
  void loadCompares();

  // 選んだシリーズを外して自動へ戻す。**表紙はそのまま残す** — 次の取り直しで貼り替わる
  $('pick-clear')?.addEventListener('click', async () => {
    try {
      await api(`/api/series/${id}/cover-pick`, { method: 'DELETE' });
      toast('自動に戻しました。「表紙を探して選ぶ」で当て直せます', 5000);
      await openDetail(id, 'keep');
    } catch (e) {
      toast('失敗: ' + e.message, 5000);
    }
  });

  // 名前を直す。**見る → 押す**の二段。計画を見ずに棚を動かせる形にはしない
  $('rn-open')?.addEventListener('click', async () => {
    if (renamer.open && renamer.seriesId === id) renameClose();
    else renameOpen(d);
    await openDetail(id, 'keep');
  });
  $('rn-cancel')?.addEventListener('click', async () => {
    renameClose();
    await openDetail(id, 'keep');
  });
  $('rn-plan')?.addEventListener('click', async () => {
    renameCollect();
    try {
      const r = await api(`/api/series/${id}/rename`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: renamer.title, author: renamer.author, completed: renamer.completed }),
      });
      renamer.plan = r.plan;
    } catch (err) {
      renamer.plan = null;
      toast('できません: ' + err.message, 6000);
    }
    await openDetail(id, 'keep');
  });
  $('rn-go')?.addEventListener('click', async (e) => {
    renameCollect();
    const p = renamer.plan;
    // 注意書きが立っている計画はもう一度聞く。巻数を読めなくなるファイルが出る
    if (p?.warnings.length && !confirm(p.warnings.join('\n\n') + '\n\nそれでも付け替えますか?')) return;
    const btn = e.currentTarget;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> 付け替え中';
    try {
      const r = await api(`/api/series/${id}/rename`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: renamer.title, author: renamer.author, completed: renamer.completed,
          apply: true, confirm: true,
        }),
      });
      const missed = r.result.missing ? ` / 棚に無かった ${r.result.missing} 点は飛ばしました` : '';
      toast(`「${r.result.to}」に付け替えました — ファイル ${r.result.renamed} 件${missed}`, 5000);
      renameClose();
      await openDetail(id, 'keep');
      await loadGrid();
    } catch (err) {
      toast('失敗: ' + err.message, 6000);
      btn.disabled = false;
      btn.textContent = 'この名前に付け替える';
    }
  });

  // エクスプローラ。PC から見ている時しかボタンが無い (caps.reveal)
  $('reveal')?.addEventListener('click', () => reveal(id, null));
  $('detail').querySelectorAll('button[data-reveal-file]').forEach((b) => {
    b.addEventListener('click', () => reveal(id, Number(b.dataset.revealFile)));
  });
}

/** pinax が動いている PC でフォルダを開く。fileId を渡すとそのファイルを選択した状態で開く */
async function reveal(id, fileId) {
  try {
    await api(`/api/series/${id}/reveal`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(fileId ? { fileId } : {}),
    });
    toast('エクスプローラで開きました');
  } catch (e) {
    toast('開けません: ' + e.message, 5000);
  }
}

// ---- 表紙を選ぶ ---------------------------------------------------------

/**
 * **同じ書名で別のシリーズが並走している作品を、人が直す場所。**
 *
 * 血界戦線を NDL に聞くと、無印 / Back 2 Back / Beat 3 Peat が 1 つの答えに混ざって返る。
 * 機械には手元の棚がどれなのか分からないので、束ねて並べて「これ」と選ばせる
 * (src/bib/candidates.ts の頭)。
 *
 * 板はもう 1 枚重ねない。**詳細の中身だけを差し替える** — 詳細は履歴を 1 つ積んで
 * 開いているので、上にもう 1 枚乗せると Android の戻るでどちらが閉じるのか分からなくなる。
 */
/**
 * 表紙を選ぶ画面の持ち物。
 *
 * `target` は差し替える板 — `{ slot, label }` で、詳細が返した宛先をそのまま持つ。
 * **null なら作品全体**で、その時だけシリーズごと乗り換える口が出る。
 * 以前は板を巻数 (数字) で持っていたので、番号の無い合本と別巻を名指しできなかった。
 */
const picker = {
  seriesId: null, target: null, q: '', author: '', provider: 'all',
  groups: [], open: new Set(), pick: null, note: '', warn: false, body: '',
};

const volLabel = (n) => `第${String(n).padStart(2, '0')}巻`;

/** 束に付く提供元の印。**openBD は並ばない** — ISBN 起点でしか引けないので候補を出せない */
const PROVIDER_LABEL = { ndl: 'NDL', rakuten: '楽天', google: 'Google' };

/** 候補の画像は pinax が中継する。NDL は Referer を見て弾くので、ブラウザからは引けない */
const thumbUrl = (u) => '/api/bib/thumb?u=' + encodeURIComponent(u);

/** 書名の板を敷いて、その上に下見の画像を重ねる。取れなければ img だけ消えて板が残る */
function pkCover(url, fallback) {
  const none = `<span class="none">${esc(fallback)}</span>`;
  return url ? `${none}<img loading="lazy" class="over" src="${thumbUrl(url)}" alt="" onerror="this.remove()">` : none;
}

function pkItemHtml(c) {
  const label = c.volume === null ? '巻なし' : volLabel(c.volume);
  /**
   * 貼り先の渡し方は 2 通りで、**どちらか一方だけ**を持たせる:
   *
   *   data-slot   … 板を押して開いた時。詳細が返した宛先をそのまま送り返す
   *   data-volume … 候補から直接貼る時 (数字なら第n巻、空なら代表表紙)
   *
   * 候補の側で宛先を組み立てないのは、**綴り方を画面にも持たせないため** (volCardHtml)。
   */
  const use = (attr, text) =>
    `<button class="mini" data-use="${esc(c.imageUrl)}" data-provider="${esc(c.provider)}"
      data-isbn="${esc(c.isbn ?? '')}" ${attr}>${text}</button>`;
  /**
   * 板を指定して来た時は、候補が何巻であろうとその板へ貼る。
   *
   * そうでない時は、巻に貼る口と棚に並ぶ 1 枚 (代表表紙) に貼る口を両方出す。
   * **代表は「持っている中で一番若い巻」から勝手に決まる** ので、第1-2巻が合本の作品では
   * 第4巻の絵が棚に並ぶ。そこを手で直せる口が要る
   */
  const btn = !c.imageUrl
    ? '<span class="sub">書影なし</span>'
    : picker.target !== null
      ? use(`data-slot="${esc(picker.target.slot)}"`, picker.target.label + 'に使う')
      : c.volume === null
        ? use('data-volume=""', '代表表紙にする')
        : use(`data-volume="${c.volume}"`, volLabel(c.volume) + 'に使う') + use('data-volume=""', '代表にする');
  return `<div class="pk-item">
    <span class="cover">${pkCover(c.imageUrl, label)}</span>
    <span class="lbl">${esc(label)}</span>
    <span class="sub">${esc(c.title)}</span>
    <span class="sub">${esc(c.date ?? '')}</span>
    ${btn}
  </div>`;
}

function pkGroupHtml(g) {
  const on = picker.pick && picker.pick.groupKey === g.key;
  const years = g.firstYear
    ? (g.lastYear && g.lastYear !== g.firstYear ? `${g.firstYear}〜${g.lastYear}年` : `${g.firstYear}年`)
    : '';
  const vols = g.volumeMax
    ? `${volLabel(g.volumes[0])}〜${volLabel(g.volumeMax)} (${g.volumes.length}冊)`
    : '巻の並びなし';
  const meta = [g.author, years, vols, g.publisher, `${g.count}件`].filter(Boolean).join(' · ');
  const acts = [];
  // 板を指定して開いている時は「シリーズごと乗り換える」を出さない。
  // 押したつもりの無い作品全体の貼り直しが走るのは驚きが大きい
  if (picker.target === null) {
