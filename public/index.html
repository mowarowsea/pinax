    acts.push(`<button class="btn primary" data-pick="${esc(g.key)}">このシリーズにする</button>`);
  }
  acts.push(`<button class="mini" data-open="${esc(g.key)}">${picker.open.has(g.key) ? '巻を閉じる' : '巻を見る'}</button>`);

  return `<div class="pk-group${on ? ' on' : ''}">
    <span class="pk-g-cover">${pkCover(g.coverUrl, g.title)}</span>
    <div class="pk-g-info">
      <div class="pk-g-title">${esc(g.title)}
        ${g.providers.map((x) => `<span class="pk-tag">${PROVIDER_LABEL[x] ?? x}</span>`).join('')}
        ${on ? '<span class="pk-tag">選択中</span>' : ''}</div>
      <div class="pk-g-meta">${esc(meta)}</div>
      <div class="pk-g-acts">${acts.join('')}</div>
    </div>
  </div>
  ${picker.open.has(g.key) ? `<div class="pk-items">${g.items.map(pkItemHtml).join('')}</div>` : ''}`;
}

function renderPicker() {
  // 板を指定して来た時だけ、何をしに来たのかを出す。**それ以外の説明書きは置かない** —
  // 並んでいるものを見れば分かることを毎回読ませない
  const forWhat = picker.target === null ? '' : `${picker.target.label}の表紙だけを差し替えます`;
  $('detail').innerHTML = `
    <div class="pk-head">
      <button class="btn" id="pk-back">← 作品へ戻る</button>
      ${forWhat ? `<span class="pk-for">${forWhat}</span>` : ''}
    </div>
    <div class="pk-form">
      <input id="pk-q" value="${esc(picker.q)}" placeholder="作品名" autocomplete="off">
      <input id="pk-author" value="${esc(picker.author)}" placeholder="著者" autocomplete="off">
      <select class="sort" id="pk-provider">
        <option value="all">全部に聞く</option>
        <option value="ndl">NDL だけ</option>
        <option value="rakuten">楽天だけ</option>
        <option value="google">Google だけ</option>
      </select>
      <button class="btn primary" id="pk-go">探す</button>
    </div>
    ${picker.note ? `<div class="pk-note${picker.warn ? ' warn' : ''}">${esc(picker.note)}</div>` : ''}
    ${picker.body}`;
  $('pk-provider').value = picker.provider;
  wirePicker();
}

async function openPicker(target = null) {
  const d = lastDetail;
  if (!d) return;
  picker.seriesId = d.id;
  picker.target = target;
  // 前に選んだ時の検索語があればそれを出す。無ければ棚の作品名と著者。
  // **空で選んだ人は空のまま出す** (著者だけで引き当てた作品がある)
  picker.q = d.pick ? d.pick.queryTitle : d.title;
  picker.author = d.pick ? (d.pick.queryAuthor || '') : (d.author || '');
  picker.provider = 'all';
  picker.groups = [];
  picker.open = new Set();
  picker.pick = d.pick ?? null;
  $('sheet-title').textContent = `${d.label || d.title} — 表紙を選ぶ`;
  await runPickerSearch();
}

async function runPickerSearch(refresh) {
  picker.note = '';
  picker.warn = false;
  picker.body = '<div class="empty"><span class="spin"></span> 外に聞いています</div>';
  renderPicker();

  try {
    const p = new URLSearchParams({ q: picker.q, author: picker.author, provider: picker.provider });
    if (refresh) p.set('refresh', '1');
    const r = await api(`/api/series/${picker.seriesId}/cover-search?` + p);
    picker.pick = r.pick;
    picker.groups = r.groups;

    // 開いておくものを決める。選択中のものがあればそれ、無ければ一番巻の揃っているもの。
    // **板を指定して来た時は必ず 1 つ開く** — 候補を見に来たのに畳まれていては用を成さない
    const chosen = r.groups.find((g) => r.pick && g.key === r.pick.groupKey);
    const head = chosen ?? r.groups[0];
    const openHead = picker.target !== null || r.groups.length === 1;
    picker.open = new Set(openHead && head ? [head.key] : chosen ? [chosen.key] : []);

    // **うまくいった時は何も言わない。** 言うのは相手が落ちていた時と、0 件だった時だけ
    const errs = (r.errors ?? []).map((e) => `${e.provider}: ${e.message}`).join(' / ');
    picker.warn = Boolean(errs);
    picker.note = r.groups.length
      ? errs
      : `候補が見つかりませんでした${errs ? ` — ${errs}` : ''}`;
    picker.body = r.groups.length
      ? r.groups.map(pkGroupHtml).join('')
      : '<div class="empty">検索語を変えて探し直してください</div>';
  } catch (e) {
    picker.warn = true;
    picker.note = '失敗: ' + e.message;
    picker.body = '';
  }
  renderPicker();
}

function wirePicker() {
  $('pk-back').addEventListener('click', () => openDetail(picker.seriesId, 'keep'));
  $('pk-go').addEventListener('click', () => {
    picker.q = $('pk-q').value.trim();
    picker.author = $('pk-author').value.trim();
    picker.provider = $('pk-provider').value;
    runPickerSearch();
  });
  for (const id of ['pk-q', 'pk-author']) {
    $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') $('pk-go').click(); });
  }

  $('detail').querySelectorAll('button[data-open]').forEach((b) => {
    b.addEventListener('click', () => {
      const k = b.dataset.open;
      if (picker.open.has(k)) picker.open.delete(k);
      else picker.open.add(k);
      picker.body = picker.groups.map(pkGroupHtml).join('');
      renderPicker();
    });
  });

  $('detail').querySelectorAll('button[data-pick]').forEach((b) => {
    b.addEventListener('click', () => choosePickedGroup(b));
  });
  $('detail').querySelectorAll('button[data-use]').forEach((b) => {
    b.addEventListener('click', () => useOneCover(b));
  });
}

/**
 * シリーズごと乗り換える。**書誌も表紙も貼り直す** ので、持っている巻の数だけ外を叩く。
 * 相手には間を空けて聞く決まりなので 10 巻で十数秒かかる — 押した後は必ず印を出す。
 */
async function choosePickedGroup(btn) {
  const key = btn.dataset.pick;
  const g = picker.groups.find((x) => x.key === key);
  if (!g) return;

  const all = $('detail').querySelectorAll('button[data-pick], button[data-use]');
  all.forEach((b) => { b.disabled = true; });
  btn.innerHTML = '<span class="spin"></span> 貼り直しています';
  try {
    const r = await api(`/api/series/${picker.seriesId}/cover-pick`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        scope: picker.provider, groupKey: key, title: g.title,
        // 棚のフォルダ名に書く形へ寄せた方を送る。提供元の表記そのまま
        // (NDL の「内藤, 泰弘」) は名前を直す欄の既定値にできない
        author: g.authorName || g.author || '',
        queryTitle: picker.q, queryAuthor: picker.author,
      }),
    });
    toast(`${g.title} にしました — 書誌 ${r.result.bibWritten} / 表紙 ${r.result.coversWritten} 枚`, 5000);
    await openDetail(picker.seriesId, 'keep');
    await loadGrid();
  } catch (e) {
    toast('失敗: ' + e.message, 6000);
    all.forEach((b) => { b.disabled = false; });
    btn.textContent = 'このシリーズにする';
  }
}

/** 板 1 枚の絵だけ差し替える。書誌は触らない */
async function useOneCover(btn) {
  // 宛先は片方だけ送る (pkItemHtml)。名前はサーバーが返したものを使う —
  // 板の呼び方を画面でも組み立てると、言い方が 2 通りに割れる
  const where = btn.dataset.slot !== undefined
    ? { slot: btn.dataset.slot }
    : { volume: btn.dataset.volume === '' ? null : Number(btn.dataset.volume) };
  const before = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>';
  try {
    const r = await api(`/api/series/${picker.seriesId}/cover`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ...where, provider: btn.dataset.provider,
        imageUrl: btn.dataset.use, isbn: btn.dataset.isbn || null,
      }),
    });
    toast(r.slot === '' ? '代表表紙にしました' : `${r.label}の表紙にしました`);
    await loadGrid();
    // 板を指定して来たなら用は済んだ。作品へ戻って結果を見せる
    if (picker.target !== null) { await openDetail(picker.seriesId, 'keep'); return; }
    btn.disabled = false;
    btn.textContent = before;
  } catch (e) {
    toast('失敗: ' + e.message, 5000);
    btn.disabled = false;
    btn.textContent = before;
  }
}

// ---- 棚に無い作品の名前を作る -------------------------------------------

/**
 * **棚を一切触らない道具。** 手元にあるのに棚へ出てこないファイル — 名前が
 * 決まりから外れていて拾われないもの — に付ける名前を、外の書誌から探して渡すだけ。
 *
 * 拾われないから棚からは直せず (「名前を直す」は既にある作品を動かす口)、
 * 直せないから拾われない。その堂々巡りを切るために、**作品に紐付かない入口**を
 * 棚の操作の並びに置いてある。
 *
 * 渡すのは**第01巻の名前を 1 本だけ。** フォルダ名は末尾の「 第01巻」を削れば作れて、
 * 第02巻から先は数字を打ち替えれば済む。以前はここに著者と作品名の欄、巻の範囲、
 * (完) を付ける巻、全巻ぶんの一覧まで置いていたが、**人が写すのは結局 1 本**で、
 * 欄の方が画面を埋めていた。
 *
 * 名前そのものはサーバーが組み立てる (`/api/bib/candidates` が添えてくる)。
 * 使えない文字の倒し方も長い名前の詰め方も naming.ts が持っていて、ここへ写すと
 * 書く側と読む側が別々の決まりを持ち始める。
 */
const namer = { q: '', author: '', provider: 'all', note: '', warn: false, body: '' };

function nmGroupHtml(g) {
  const years = g.firstYear
    ? (g.lastYear && g.lastYear !== g.firstYear ? `${g.firstYear}〜${g.lastYear}年` : `${g.firstYear}年`)
    : '';
  const vols = g.volumeMax
    ? `${volLabel(g.volumes[0])}〜${volLabel(g.volumeMax)} (${g.volumes.length}冊)`
    : '巻の並びなし';
  const meta = [g.authorName || g.author, years, vols, g.publisher].filter(Boolean).join(' · ');
  return `<div class="pk-group">
    <span class="pk-g-cover">${pkCover(g.coverUrl, g.title)}</span>
    <div class="pk-g-info">
      <div class="pk-g-title">${esc(g.title)}
        ${g.providers.map((x) => `<span class="pk-tag">${PROVIDER_LABEL[x] ?? x}</span>`).join('')}</div>
      <div class="pk-g-meta">${esc(meta)}</div>
      ${g.name ? `<div class="nm-row">
        <span class="nm-name">${esc(g.name)}</span>
        <button class="mini" data-copy="${esc(g.name)}">コピー</button>
      </div>` : '<div class="nm-hint">この書名では棚の名前を作れません</div>'}
    </div>
  </div>`;
}

const nmResHtml = () =>
  `${namer.note ? `<div class="pk-note${namer.warn ? ' warn' : ''}">${esc(namer.note)}</div>` : ''}${namer.body}`;

function namerHtml() {
  return `<div class="pk-form">
    <input id="nm-q" value="${esc(namer.q)}" placeholder="作品名" autocomplete="off">
    <input id="nm-qa" value="${esc(namer.author)}" placeholder="著者" autocomplete="off">
    <select class="sort" id="nm-provider">
      <option value="all">全部に聞く</option>
      <option value="ndl">NDL だけ</option>
      <option value="rakuten">楽天だけ</option>
      <option value="google">Google だけ</option>
    </select>
    <button class="btn primary" id="nm-go">探す</button>
  </div>
  <div id="nm-res">${nmResHtml()}</div>`;
}

/**
 * 名前を作る板を開く。詳細と同じく履歴を 1 つ積む (Android の戻るで閉じるため)。
 * mode は openDetail と同じ意味で、'entry' は `#/names` を直に開いた時。
 */
function openNamer(mode = 'push') {
  showSheet();
  if (mode === 'push') history.pushState({ sheetId: 'names' }, '', '#/names');
  else history.replaceState({ sheetId: 'names', entry: true }, '', '#/names');
  // **板に出ているのは作品ではない。** lastDetail を残したままにすると、
  // 棚を読み直した後にここが作品の詳細へ化ける (読み直しは開いた板を貼り直す)
  lastDetail = null;
  $('sheet-title').textContent = '名前を作る';
  $('detail').innerHTML = namerHtml();
  $('detail').scrollTop = 0;
  $('nm-provider').value = namer.provider;
  wireNamer();
}

async function runNamerSearch() {
  namer.note = '';
  namer.warn = false;
  namer.body = '<div class="empty"><span class="spin"></span> 外に聞いています</div>';
  $('nm-res').innerHTML = nmResHtml();
  try {
    const r = await api('/api/bib/candidates?' + new URLSearchParams({
      q: namer.q, author: namer.author, provider: namer.provider,
    }));
    // **うまくいった時は何も言わない** (表紙選びと同じ)。言うのは相手が落ちた時と 0 件の時
    const errs = (r.errors ?? []).map((e) => `${e.provider}: ${e.message}`).join(' / ');
    namer.warn = Boolean(errs);
    namer.note = r.groups.length ? errs : `候補が見つかりませんでした${errs ? ` — ${errs}` : ''}`;
    namer.body = r.groups.length ? r.groups.map(nmGroupHtml).join('') : '';
  } catch (e) {
    namer.warn = true;
    namer.note = '失敗: ' + e.message;
    namer.body = '';
  }
  $('nm-res').innerHTML = nmResHtml();
}

async function copyAndTell(text, what) {
  const ok = await copyText(text);
  toast(
    ok ? `写しました — ${what ?? text}` : '写せませんでした。名前を長押しで選んでコピーしてください',
    ok ? 2500 : 6000
  );
}

function wireNamer() {
  $('nm-go').addEventListener('click', () => {
    namer.q = $('nm-q').value.trim();
    namer.author = $('nm-qa').value.trim();
    namer.provider = $('nm-provider').value;
    runNamerSearch();
  });
  for (const id of ['nm-q', 'nm-qa']) {
    $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') $('nm-go').click(); });
  }
  // 写す口は探すたびに作り直されるので、親で受ける
  $('nm-res').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-copy]');
    if (b) copyAndTell(b.dataset.copy);
  });
}

// ---- 読む ---------------------------------------------------------------

/**
 * 書庫を開いてページをめくる。**絵は 1 枚ずつサーバーから貰うだけ。**
 *
 * サーバーは読んでいる場所を覚えない。どこまで読んだかはこの画面と URL
 * (`#/read/<ファイルid>`) にしか無いので、**何人が同時に読んでも混ざらない。**
 * 覚えているのは書庫の索引だけで、これは誰が読んでも同じ内容。
 *
 * 見開き (横長) のページは**絵を加工せずに**割る。同じ画像を 2 回出して、
 * 窓の方を半分にしてずらすだけ。元のファイルにも表紙にも触らずに済む上に、
 * ページ番号も「14 / 175」のまま右半分→左半分と進むので嘘にならない。
 */
const RD_MODE_KEY = 'pinax.readMode';
const RD_AHEAD = 3;
const RD_BACK = 1;

/** 同じ色とみなす幅 (0-255)。JPEG のざらつきを吸う */
const RD_TOL = 12;
/** 片側で削ってよい上限。**これが唯一の歯止め** (下の rdMeasure を参照) */
const RD_TRIM_MAX = 0.2;
/** 測る時の横の粗さ。端の色が変わる場所が数 px ずれても、読む分には誰も気付かない */
const RD_TRIM_W = 400;

const reader = {
  fileId: null,
  pages: [],
  page: 0,
  /** null = 割らない / 1 = 右半分 / 0 = 左半分。**右から先に読む** */
  half: null,
  mode: 'rtl',
  /** 先読みの控え。DOM には入れず、寸法を測るのと通信を先に始めるためだけに持つ */
  imgs: new Map(),
  /** i → {x0, x1}。帯を削った後の「絵のある横の範囲」。数字 2 つなので捨てずに持つ */
  trims: new Map(),
  /** i → 見開きか。**一度分かったら覚えておく** — 絵を外してもマスの数を変えないため */
  wide: new Map(),
  barTimer: null,
  seq: 0,
  vertTick: 0,
  rtlTick: 0,
  /** 今開いている本に「ケアが必要」の印が立っているか (帯のボタンの見た目) */
  care: false,
  /** 帯に出す作品情報 */
  title: '',
  author: '',
  volLabel: '',
};

const readerOpen = () => !$('rd').hidden;
const rdUrl = (i) => `/api/files/${reader.fileId}/page/${i}`;

/** localStorage は端末ごと。**PC とスマホで別々に覚える**が、それでいい */
function rdMode() {
  try { return localStorage.getItem(RD_MODE_KEY) === 'vert' ? 'vert' : 'rtl'; } catch { return 'rtl'; }
}
function rdSaveMode(m) {
  try { localStorage.setItem(RD_MODE_KEY, m); } catch { /* 見られない端末でも読めること自体は困らない */ }
}

/**
 * 読みかけのページも localStorage。**端末ごとに別** — 読み方と同じ立場。
 * ファイルの id → ページ番号。`[[id, page], …]` の並びで持ち、**後ろほど最近**。
 * 数字キーのオブジェクトは入れた順を覚えないので、古いものから捨てるために並びにする
 */
const RD_POS_KEY = 'pinax.readPos';
const RD_POS_MAX = 300;
function rdLoadPos() {
  try {
    const v = JSON.parse(localStorage.getItem(RD_POS_KEY) ?? '[]');
    return Array.isArray(v) ? v.filter((e) => Array.isArray(e) && Number.isInteger(e[0]) && Number.isInteger(e[1])) : [];
  } catch { return []; }
}
function rdSavedPage(fileId) {
  return rdLoadPos().find((e) => e[0] === fileId)?.[1] ?? 0;
}
function rdSavePos() {
  // ページを知る前 (書庫を開いている最中) は 0 ページ目と区別がつかないので書かない
  if (reader.fileId === null || !reader.pages.length) return;
  const list = rdLoadPos().filter((e) => e[0] !== reader.fileId);
  list.push([reader.fileId, reader.page]);
  try {
    localStorage.setItem(RD_POS_KEY, JSON.stringify(list.slice(-RD_POS_MAX)));
  } catch { /* 覚えられないだけで、今は読める */ }
}

function rdImg(i) {
  let img = reader.imgs.get(i);
  if (!img) {
    img = new Image();
    img.src = rdUrl(i);
    reader.imgs.set(i, img);
  }
  return img;
}

/** 前後を先に取っておく。**遠くの控えは捨てる** — 1 冊 200 枚を抱えたままにしない */
function rdPrefetch() {
  for (let d = -RD_BACK; d <= RD_AHEAD; d++) {
    const i = reader.page + d;
    if (i >= 0 && i < reader.pages.length) rdImg(i);
  }
  for (const k of [...reader.imgs.keys()]) {
    if (k < reader.page - RD_BACK - 2 || k > reader.page + RD_AHEAD + 2) reader.imgs.delete(k);
  }
}

const rdWide = (i) => {
  const img = reader.imgs.get(i);
  if (!img || !img.naturalWidth) return false;
  // **帯を削った後の形で判じる。** 帯のぶんだけ横に太って見えていたページを
  // 割ってしまうと、縦 1 枚の絵が真っ二つになる
  const t = rdTrim(i);
  return t.x1 - t.x0 > img.naturalHeight;
};

const rdReady = (img) =>
  img.complete ? Promise.resolve() : new Promise((res) => {
    img.addEventListener('load', res, { once: true });
    img.addEventListener('error', res, { once: true });
  });

// ---- 端の無地を削る ----

/**
 * 端から続く無地の帯を測って、**絵のある範囲** `{x0, x1}` を元画像の px で返す。
 *
 * 電子書籍ビューアの画面を撮った書庫は、紙面の左右にそのビューアの地の色が
 * 焼き込まれている。削らないとその帯が画面の幅を食って、絵だけが縮む。
 *
 * **色が変わった所で必ず止まる**ので、絵もノンブルも消えない。危ないのは
 * 「端から端まで一色」のページ (巻頭の白紙、扉の裏) だけで、それは下で弾く。
 */
function rdTrim(i) {
  const hit = reader.trims.get(i);
  if (hit) return hit;
  const img = reader.imgs.get(i);
  if (!img || !img.naturalWidth) return { x0: 0, x1: 0 };
  let out = { x0: 0, x1: img.naturalWidth };
  // 絵を読み出せない端末でも、削らなければ今まで通り読める
  try { out = rdMeasure(img); } catch { /* 削らない */ }
  reader.trims.set(i, out);
  return out;
}

/** 測る紙は 1 枚を使い回す。ページごとに作ると捨てる手間の方が重い */
let rdCanvas = null;

function rdMeasure(img) {
  const nw = img.naturalWidth;
  const nh = img.naturalHeight;
  const full = { x0: 0, x1: nw };
  const w = Math.min(RD_TRIM_W, nw);
  const h = Math.max(1, Math.round(w * nh / nw));
  if (!rdCanvas) rdCanvas = document.createElement('canvas');
  const cx = rdCanvas.getContext('2d', { willReadFrequently: true });
  rdCanvas.width = w;
  rdCanvas.height = h;
  cx.drawImage(img, 0, 0, w, h);
  const d = cx.getImageData(0, 0, w, h).data;
  // 縦は 48 点だけ見る。全部のピクセルを見ても答えは変わらないのに、時間は桁で増える
  const ys = [];
  for (let k = 0; k < 48; k++) ys.push(Math.floor(h * (k + 0.5) / 48));
  const at = (x) => { const o = (ys[ys.length >> 1] * w + x) * 4; return [d[o], d[o + 1], d[o + 2]]; };
  const same = (x, c) => ys.every((y) => {
    const o = (y * w + x) * 4;
    return Math.abs(d[o] - c[0]) <= RD_TOL
      && Math.abs(d[o + 1] - c[1]) <= RD_TOL
      && Math.abs(d[o + 2] - c[2]) <= RD_TOL;
  });
  // **端から真ん中まで一色なら、そのページは無地。** 白紙を横へ引き伸ばさない
  if (same(w >> 1, at(0))) return full;
  // 片側で削ってよいのはここまで。**見開きの片側が丸ごと空白の回でも、
  // 見開きの形は崩さない** — 読んでいる途中で紙の大きさが変わる方が目に付く
  const lim = Math.floor(w * RD_TRIM_MAX);
  const run = (dir) => {
    const c = at(dir > 0 ? 0 : w - 1);
    let n = 0;
    while (n < lim && same(dir > 0 ? n : w - 1 - n, c)) n++;
    return n;
  };
  const sc = nw / w;
  const x0 = Math.round(run(1) * sc);
  const x1 = nw - Math.round(run(-1) * sc);
  return x1 > x0 ? { x0, x1 } : full;
}

/** 縦読み用。段の幅が決まっているので割合で足りる */
function rdWinVertHtml(i, x0, x1) {
  const img = rdImg(i);
  const cw = Math.max(1, Math.round(x1 - x0));
  const pct = (v) => `${(v / cw * 100).toFixed(3)}%`;
  return `<div class="rd-half" style="aspect-ratio:${cw}/${img.naturalHeight}">
    <img src="${rdUrl(i)}" loading="lazy" alt="${i + 1} ページ目"
      style="width:${pct(img.naturalWidth)};margin-left:${pct(-x0)}"></div>`;
}

/** 右から左用。画面に収まるいちばん大きい窓を px で出す */
function rdWinRtlHtml(i, x0, x1) {
  const img = rdImg(i);
  const stage = $('rd-stage');
  const cw = Math.max(1, x1 - x0);
  const scale = Math.min(stage.clientWidth / cw, stage.clientHeight / img.naturalHeight);
  const w = Math.max(1, Math.round(cw * scale));
  const h = Math.max(1, Math.round(img.naturalHeight * scale));
  return `<div class="rd-half" style="width:${w}px;height:${h}px">
    <img src="${rdUrl(i)}" alt="${i + 1} ページ目"
      style="width:${Math.round(img.naturalWidth * scale)}px;height:${h}px;margin-left:${-Math.round(x0 * scale)}px"></div>`;
}

// ---- 右から左 ----

const RD_EMPTY_CELL = '<div class="rd-cell"><div class="rd-msg">読み込み中</div></div>';

const rdCells = () => $('rd-stage').querySelectorAll('.rd-cell');

/** 今見ているマスの番号 (先頭 = 0)。rtl の横スクロールは右端が 0 で、左へ進むほど負になる */
function rdCellAt() {
  const s = $('rd-stage');
  return Math.round(Math.abs(s.scrollLeft) / Math.max(1, s.clientWidth));
}

function rdScrollToCell(cell) {
  if (!cell) return;
  const s = $('rd-stage');
  const k = [...rdCells()].indexOf(cell);
  if (k >= 0) s.scrollLeft = -k * s.clientWidth;
}

/** ページ i の、見開きなら右半分 (half=1) / 左半分 (half=0) のマス。割っていなければ 1 つ目 */
function rdCellOf(i, half) {
  const cs = $('rd-stage').querySelectorAll(`.rd-page[data-i="${i}"] > .rd-cell`);
  return cs.length > 1 && half === 0 ? cs[1] : cs[0];
}

/**
 * 全ページのマスを並べて、今のページまで送る。絵はまだ入れない (rdLoadAround が入れる)。
 * 見開きと分かっているページは最初から 2 マス
 */
function rdDrawRtl() {
  ++reader.seq;
  const stage = $('rd-stage');
  stage.className = 'rd-stage rtl';
  stage.innerHTML = reader.pages
    .map((p, i) => `<div class="rd-page" data-i="${i}">${RD_EMPTY_CELL.repeat(reader.wide.get(i) ? 2 : 1)}</div>`)
    .join('');
  rdScrollToCell(rdCellOf(reader.page, reader.half ?? 1));
  rdMeta();
  rdLoadAround();
}

/** 読み込み済みのページ i をマスに描く。**見開きは右半分が先** (右から読む) */
function rdRenderPage(box, i) {
  const img = reader.imgs.get(i);
  const t = rdTrim(i);
  const wide = rdWide(i);
  let cells;
  if (wide) {
    const mid = Math.round((t.x0 + t.x1) / 2);
    cells = [rdWinRtlHtml(i, mid, t.x1), rdWinRtlHtml(i, t.x0, mid)];
  } else if (t.x0 || t.x1 < img.naturalWidth) {
    cells = [rdWinRtlHtml(i, t.x0, t.x1)];
  } else {
    // 削る所が無いなら窓も要らない。CSS に収めさせる方が、画面が回った時に強い
    cells = [`<img src="${rdUrl(i)}" alt="${i + 1} ページ目">`];
  }
  box.innerHTML = cells.map((c) => `<div class="rd-cell">${c}</div>`).join('');
  box.dataset.filled = '1';
  reader.wide.set(i, wide);
}

async function rdFillPage(i) {
  const seq = reader.seq;
  const img = rdImg(i);
  await rdReady(img);
  if (seq !== reader.seq || !readerOpen()) return;
  const box = $('rd-stage').querySelector(`.rd-page[data-i="${i}"]`);
  if (!box || box.dataset.filled === '1') return;
  const before = box.children.length;
  const at = rdCells()[rdCellAt()];
  rdRenderPage(box, i);
  /**
   * **手前のページが見開きと分かってマスが増えると、今のマスが 1 つ奥へずれる。**
   * 見ていた所へ戻す。ずれない時は触らない — 払っている最中に位置を置き直すと指が止まる
   */
  if (box.children.length !== before && at && at.isConnected && i < Number(at.parentElement.dataset.i)) {
    rdScrollToCell(at);
  }
}

/** 今の前後に絵を入れ、**遠くの絵は外す** (マスは残す)。1 冊 200 枚を抱えたままにしない */
function rdLoadAround() {
  const n = reader.pages.length;
  for (let d = -RD_BACK; d <= RD_AHEAD; d++) {
    const i = reader.page + d;
    if (i >= 0 && i < n) rdFillPage(i);
  }
  for (const box of $('rd-stage').querySelectorAll('.rd-page[data-filled="1"]')) {
    const i = Number(box.dataset.i);
    if (i < reader.page - RD_BACK - 2 || i > reader.page + RD_AHEAD + 2) {
      box.innerHTML = RD_EMPTY_CELL.repeat(box.children.length);
      box.dataset.filled = '0';
    }
  }
  rdPrefetch();
}

/** スクロールが止まったマスから、今のページを読み取る */
function rdRtlScroll() {
  if (reader.rtlTick) return;
  reader.rtlTick = requestAnimationFrame(() => {
    reader.rtlTick = 0;
    if (reader.mode !== 'rtl') return;
    const cell = rdCells()[rdCellAt()];
    if (!cell) return;
    const box = cell.parentElement;
    const i = Number(box.dataset.i);
    const half = box.children.length > 1 ? (cell === box.children[0] ? 1 : 0) : null;
    if (i === reader.page && half === reader.half) return;
    reader.page = i;
    reader.half = half;
    rdMeta();
    rdLoadAround();
  });
}

/**
 * 次に開く本。**巻の並び (巻数順) で 1 つ後ろの巻の先頭ファイル** — 表紙を押した時と同じく、
 * 分割書庫は先頭だけを開く (readCover)。
 * 次の巻が無い時は null。別巻やどこにも属さないファイルも、続きが決まらないので null。
 * 作品の中身をまだ知らない時 (`#/read/…` を直に開いた) は undefined — 分からないので何もしない
 */
function rdNextFileId() {
  if (!lastDetail) return undefined;
  const vols = lastDetail.volumes.filter((v) => v.files.length > 0);
  const idx = vols.findIndex((v) => v.files.some((f) => f.id === reader.fileId));
  if (idx < 0 || idx >= vols.length - 1) return null;
  return vols[idx + 1].files[0].id;
}

/** 最後のページから更に進もうとした。次の巻を開くか聞く */
function rdGoNextVolume() {
  const nextId = rdNextFileId();
  if (nextId === undefined) return;
  if (nextId === null) { alert('次巻がありません'); return; }
  const next = lastDetail.volumes.find((v) => v.files.some((f) => f.id === nextId));
  if (confirm(next?.label ? `次の巻（${next.label}）を開きますか?` : '次の巻を開きますか?')) {
    // 巻を送るたびに履歴を積むと、閉じるのに戻るを何度も押すことになる
    openReader(nextId, 'replace');
  }
}

/** 右から左で 1 マス送る。今のページは、スクロールを受けた rdRtlScroll が直す */
function rdGo(d) {
  const cs = rdCells();
  if (!cs.length) return;
  const k = rdCellAt() + d;
  if (k >= cs.length) { rdGoNextVolume(); return; }
  if (k < 0) return;
  rdScrollToCell(cs[k]);
}

// ---- 縦読み ----

function rdDrawVert() {
  ++reader.seq;
  const stage = $('rd-stage');
  stage.className = 'rd-stage vert';
  // 高さが分かる前は仮の比で場所を取っておく。取らないと読み込むたび下が跳ねる
  stage.innerHTML = reader.pages
    .map((p, i) => `<div class="rd-page" data-i="${i}"><img src="${rdUrl(i)}" loading="lazy"
      alt="${i + 1} ページ目" style="width:100%;aspect-ratio:0.7"></div>`)
    .join('');
  const at = stage.children[reader.page];
  if (at) stage.scrollTop = at.offsetTop;
  rdMeta();
}

/**
 * 縦読みでも見開きは割る。**読み込んで初めて横長と分かる**ので、
 * 載ってから差し替える。画面に入る手前で読む (loading=lazy) ので、
 * 差し替えはたいてい見えていない所で起きる
 */
function rdVertLoaded(e) {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !img.parentElement) return;
  const box = img.parentElement;
  if (!box.classList.contains('rd-page')) return;
  const i = Number(box.dataset.i);
  if (!Number.isInteger(i)) return;
  reader.imgs.set(i, img);
  const t = rdTrim(i);
  if (rdWide(i)) {
    const mid = Math.round((t.x0 + t.x1) / 2);
    box.innerHTML = rdWinVertHtml(i, mid, t.x1) + rdWinVertHtml(i, t.x0, mid);
  } else if (t.x0 || t.x1 < img.naturalWidth) {
    box.innerHTML = rdWinVertHtml(i, t.x0, t.x1);
  } else {
    img.style.aspectRatio = '';
  }
}

function rdVertScroll() {
  if (reader.vertTick) return;
  reader.vertTick = requestAnimationFrame(() => {
    reader.vertTick = 0;
    const stage = $('rd-stage');
    const y = stage.scrollTop + 40;
    for (const kid of stage.children) {
      if (kid.offsetTop + kid.offsetHeight > y) {
        const i = Number(kid.dataset.i);
        if (Number.isInteger(i) && i !== reader.page) { reader.page = i; rdMeta(); }
        return;
      }
    }
  });
}

// ---- 共通 ----

function rdMeta() {
  const n = reader.pages.length;
  $('rd-no').textContent = n ? `${reader.page + 1} / ${n}` : '';
  const sl = $('rd-slider');
  sl.max = String(Math.max(1, n));
  sl.value = String(reader.page + 1);
  $('rd-mode').textContent = reader.mode === 'rtl' ? '縦読み' : '右から左';
  // 帯の情報行：作者 / タイトル / 巻
  const parts = [reader.author, reader.title, reader.volLabel].filter(Boolean);
  $('rd-info').textContent = parts.join('  ·  ');
  // ページが動くと必ずここを通る (めくる・目盛り・縦のスクロール・キー)
  rdSavePos();
}

/**
 * 帯の「要ケア」の見た目を今の印に合わせる。**押した結果はここだけで返す** —
 * 読んでいる最中に板ごと貼り直すと、下で走る描き直しでページが飛ぶ
 */
function rdSetCare(on) {
  reader.care = on;
  $('rd-care').dataset.on = on ? '1' : '0';
  $('rd-care').textContent = on ? '要ケア 済' : '要ケア';
}

function rdBar(on) {
  clearTimeout(reader.barTimer);
  $('rd-bar').dataset.off = on ? '0' : '1';
  if (on) reader.barTimer = setTimeout(() => { $('rd-bar').dataset.off = '1'; }, 2500);
}

function rdDraw() {
  if (reader.mode === 'vert') rdDrawVert();
  else rdDrawRtl();
}

async function openReader(fileId, mode = 'push') {
  reader.fileId = fileId;
  reader.pages = [];
  reader.page = 0;
  reader.half = null;
  reader.mode = rdMode();
  reader.imgs.clear();
  reader.trims.clear();
  reader.wide.clear();
  ++reader.seq;

  // 帯に出す作者・作品・巻。作品の中身を知らない時 (`#/read/…` を直に開いた) は出さない
  const holder = lastDetail
    && [...lastDetail.volumes, ...lastDetail.side].find((v) => v.files.some((f) => f.id === fileId));
  reader.title = holder ? lastDetail.title : '';
  reader.author = holder ? (lastDetail.author ?? '') : '';
  reader.volLabel = holder ? (holder.label || '本編') : '';

  $('rd').hidden = false;
  document.body.style.overflow = 'hidden';
  if (mode === 'push') history.pushState({ reader: fileId }, '', `#/read/${fileId}`);
  else if (mode === 'entry') history.replaceState({ reader: fileId, entry: true }, '', `#/read/${fileId}`);
  // 次の巻へ送った。今の履歴を差し替える (直に開いた印は引き継ぐ — 戻る先が変わらない)
  else if (mode === 'replace') {
    history.replaceState({ reader: fileId, entry: !!history.state?.entry }, '', `#/read/${fileId}`);
  }

  const stage = $('rd-stage');
  stage.className = 'rd-stage';
  stage.innerHTML = '<div class="rd-msg"><b>書庫を開いています</b>初めて開く本は少し待ちます</div>';
  rdMeta();
  rdSetCare(false);
  rdBar(true);

  /**
   * 今の印を聞きに行く。**ページの読み込みとは別に走らせる** — 書庫を開くのに
   * 20 秒かかる本があるので、待たせると帯のボタンがずっと嘘を出したままになる。
   * 途中で別の本に移っていたら捨てる
   */
  api(`/api/files/${fileId}/care`)
    .then((c) => { if (reader.fileId === fileId && readerOpen()) rdSetCare(c.care); })
    .catch(() => { /* 印が分からなくても本は読める */ });

  try {
    const r = await api(`/api/files/${fileId}/pages`);
    if (reader.fileId !== fileId || !readerOpen()) return;
    reader.pages = r.pages;
    // 読みかけから再開する。ページ数が変わっていても (中身を差し替えた) はみ出さない
    reader.page = Math.max(0, Math.min(r.pages.length - 1, rdSavedPage(fileId)));
    if (!r.pages.length) {
      // **黙って空を出さない。** 開かない理由が分からないのが一番困る
      stage.innerHTML = `<div class="rd-msg"><b>ページがありませんでした</b>${
        r.nested
          ? 'この本は中に別の書庫が入っています。先に中身を取り出してください'
          : '絵が入っていませんでした'}</div>`;
      return;
    }
    rdDraw();
  } catch (e) {
    if (reader.fileId !== fileId || !readerOpen()) return;
    stage.innerHTML = `<div class="rd-msg"><b>開けませんでした</b>${esc(e.message)}</div>`;
  }
}

function rdHide() {
  $('rd').hidden = true;
  ++reader.seq;
  reader.imgs.clear();
  reader.trims.clear();
  reader.wide.clear();
  $('rd-stage').innerHTML = '';
  clearTimeout(reader.barTimer);
  // **板が下に残っているかもしれない。** 残っている時は止めたままにする
  if (!sheetOpen()) document.body.style.overflow = '';
}

/** 自分で積んだ履歴は自分で戻す (板の closeSheet と同じ理屈) */
function closeReader() {
  const st = history.state;
  if (st && st.reader && !st.entry) { history.back(); return; }
  rdHide();
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}

function rdSetMode(m) {
  reader.mode = m;
  reader.half = null;
  rdSaveMode(m);
  rdDraw();
  rdBar(true);
}

(function wireReader() {
  $('rd-close').addEventListener('click', closeReader);
  $('rd-mode').addEventListener('click', () => rdSetMode(reader.mode === 'rtl' ? 'vert' : 'rtl'));
  // 帯は 2.5 秒で引っ込むので、押したら出し直す (続けて外したくなることがある)
  $('rd-care').addEventListener('click', () => { rdBar(true); setCare([reader.fileId], !reader.care); });
  $('rd-slider').addEventListener('input', () => {
    reader.page = Math.max(0, Math.min(reader.pages.length - 1, Number($('rd-slider').value) - 1));
    reader.half = null;
    if (reader.mode === 'vert') {
      const at = $('rd-stage').children[reader.page];
      if (at) $('rd-stage').scrollTop = at.offsetTop;
      rdMeta();
    } else {
      rdScrollToCell(rdCellOf(reader.page, 1));
      rdMeta();
      rdLoadAround();
    }
    rdBar(true);
  });

  // 絵を掴む動き (HTML の drag) が始まると pointerup が来ずに pointercancel になる。
  // 止めておかないと、絵の上から始めた押下だけが効かない
  $('rd').addEventListener('dragstart', (e) => e.preventDefault());

  /**
   * 押した時の扱い。**なぞった時は何もしない** (払ってめくった・縦に読み進めた)。
   *
   * 右から左は**右 30% が次へ、左 30% が前へ。** 真ん中は帯の出し入れ。
   * 払う向きも揃えてある (**左から右へ払えば次**) — 次のページは左隣にあるので、
   * 今のページを右へ送り出すと次が出て来る。払うのはブラウザのスクロールそのもの。
   *
   * 縦読みは**どこを押しても帯が出る**。読み進めるたびに帯が出ると、指の下が隠れて読めない
   */
  let dn = null;
  const stage = $('rd-stage');
  stage.addEventListener('pointerdown', (e) => {
    dn = { y: e.clientY, x: e.clientX, t: Date.now(), sx: stage.scrollLeft, sy: stage.scrollTop };
  });
  stage.addEventListener('pointercancel', () => { dn = null; });
  stage.addEventListener('pointerup', (e) => {
    const d = dn;
    dn = null;
    if (!d || !reader.pages.length) return;
    const moved = Math.abs(e.clientY - d.y) > 12 || Math.abs(e.clientX - d.x) > 12
      || Math.abs(stage.scrollTop - d.sy) > 4 || Math.abs(stage.scrollLeft - d.sx) > 4;
    if (moved || Date.now() - d.t > 500) return;
    if (reader.mode === 'vert') { rdBar(true); return; }
    const r = stage.getBoundingClientRect();
    const fx = (e.clientX - r.left) / Math.max(1, r.width);
    if (fx > 0.7) rdGo(1);
    else if (fx < 0.3) rdGo(-1);
    else rdBar($('rd-bar').dataset.off === '1');
  });

  /**
   * 最後のページから更に左から右へ払った。スクロールはもう動かないので、
   * 指の動きだけ見て次の巻を聞く。touchend はスクロールに引き取られても来る
   */
  let tx = null;
  stage.addEventListener('touchstart', (e) => {
    const cs = rdCells();
    tx = reader.mode === 'rtl' && e.touches.length === 1 && cs.length && rdCellAt() === cs.length - 1
      ? e.touches[0].clientX : null;
  }, { passive: true });
  stage.addEventListener('touchend', (e) => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx;
    tx = null;
    if (dx > 60 && rdCellAt() === rdCells().length - 1) rdGoNextVolume();
  });

  stage.addEventListener('scroll', () => {
    if (reader.mode === 'vert') rdVertScroll();
    else rdRtlScroll();
  });
  /**
   * 画面が回った。**窓は px で置いてある**ので描き直し、見ていたマスへ戻す
   * (マスの幅が変わると、同じ scrollLeft が別のマスを指す)
   */
  window.addEventListener('resize', () => {
    if (!readerOpen() || reader.mode !== 'rtl' || !rdCells().length) return;
    for (const box of stage.querySelectorAll('.rd-page[data-filled="1"]')) {
      const i = Number(box.dataset.i);
      const img = reader.imgs.get(i);
      if (img && img.complete && img.naturalWidth) rdRenderPage(box, i);
      else { box.innerHTML = RD_EMPTY_CELL.repeat(box.children.length); box.dataset.filled = '0'; }
    }
    rdScrollToCell(rdCellOf(reader.page, reader.half ?? 1));
  });
  // load は上がってこないので捕まえる側で受ける
  stage.addEventListener('load', (e) => { if (reader.mode === 'vert') rdVertLoaded(e); }, true);

  /**
   * キーボードの左右キーでページ送り。
   * 右開き漫画に合わせて、左キーで次へ進み、右キーで前へ戻る。
   * 縦読みの時も同じキーで前後のページへ飛べるようにしておく
   */
  const rdStep = (d) => {
    if (reader.mode === 'vert') {
      const n = reader.pages.length;
      if (!n) return;
      if (d > 0 && reader.page >= n - 1) { rdGoNextVolume(); return; }
      const next = Math.max(0, Math.min(n - 1, reader.page + d));
      if (next === reader.page) return;
      reader.page = next;
      const at = $('rd-stage').children[reader.page];
      if (at) $('rd-stage').scrollTop = at.offsetTop;
      rdMeta();
    } else {
      rdGo(d);
    }
  };

  document.addEventListener('keydown', (e) => {
    if (!readerOpen()) return;
    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) && e.target.id !== 'rd-slider') return;
    if (e.key === 'ArrowLeft') {
      e.preventDefault();
      rdStep(1);
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      rdStep(-1);
    }
  });
})();

// ---- シートの開け閉め ---------------------------------------------------

const sheetOpen = () => !$('sheet').hidden;

function showSheet() {
  if (sheetOpen()) return;
  $('sheet').hidden = false;
  // 板の裏で棚が動かないように止める。スマホでここを止めないと、
  // 板の端をなぞった指が後ろの一覧を動かして、閉じた時に見ていた場所を見失う
  document.body.style.overflow = 'hidden';
}

function hideSheet() {
  $('sheet').hidden = true;
  document.body.style.overflow = '';
}

/**
 * × / 背景 / Esc から閉じる。
 * **自分で積んだ履歴は自分で戻す** — 戻さないと、閉じた後の戻るが空振りして
 * 「戻るを 2 回押さないと出られない」状態になる。
 */
function closeSheet() {
  const st = history.state;
  if (st && st.sheetId && !st.entry) {
    history.back();  // 実際に閉じるのは下の popstate
    return;
  }
  hideSheet();
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}

// 戻る / 進むで画面と URL を合わせる。**ここが Android の戻るの受け口**
window.addEventListener('popstate', () => {
  const r = location.hash.match(/^#\/read\/(\d+)/);
  if (r) { openReader(Number(r[1]), 'keep'); return; }
  /**
   * 読むのを閉じただけ。**下の板は貼り直さない** — 読み終えて戻った時に
   * 詳細を取り直すと、見ていた所まで巻き戻って何巻から開いたか分からなくなる
   */
  if (readerOpen()) { rdHide(); return; }
  const m = location.hash.match(/^#\/series\/(\d+)/);
  if (m) {
    openDetail(Number(m[1]), 'keep').catch((e) => toast('失敗: ' + e.message, 5000));
    return;
  }
  if (location.hash.startsWith('#/names')) { openNamer('entry'); return; }
  if (sheetOpen()) hideSheet();
});

// ---- お知らせ -----------------------------------------------------------

const KIND = { series_added: '新着', volume_added: '新刊', series_completed: '完結', volume_gone: '不明' };

async function loadNews() {
  const { events } = await api('/api/events?unread=1&limit=12');
  if (!events.length) { $('news').innerHTML = ''; return; }
  $('news').innerHTML = `<div class="news">
    <div class="news-head">お知らせ <span class="count">${events.length}</span>
      <button class="btn" id="news-read" style="margin-left:auto">既読にする</button></div>
    <ul>${events.map((e) => `<li><span class="kind">${esc(KIND[e.kind] ?? e.kind)}</span>
      <b data-series="${e.series_id ?? ''}">${esc(e.title)}</b> ${esc(e.detail ?? '')}</li>`).join('')}</ul>
  </div>`;
  $('news-read').addEventListener('click', async () => {
    await api('/api/events/read', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: events.map((e) => e.id) }),
    });
    loadNews();
  });
  $('news').querySelectorAll('b[data-series]').forEach((el) => {
    if (!el.dataset.series) return;
    el.style.cursor = 'pointer';
    el.addEventListener('click', () => openDetail(Number(el.dataset.series)));
  });
}

async function loadStats() {
  const h = await api('/api/health');
  // エクスプローラを開けるかは接続元次第 (reveal.ts の頭)。サーバーの答えをそのまま使う
  if (h.reveal) caps.reveal = h.reveal;
  const c = h.counts;
  $('stats').innerHTML =
    `<span><b>${c.series}</b> 作品</span><span><b>${c.files}</b> 冊</span><span>表紙 <b>${c.covers}</b></span>`;
}

// ---- つなぎ込み ---------------------------------------------------------

for (const g of ['grid', 'favgrid']) {
  $(g).addEventListener('click', (e) => {
    const card = e.target.closest('.card');
    if (card) openDetail(Number(card.dataset.id));
  });
}
// 背景を叩いて閉じる。**押し始めが背景だった時だけ** —
// click は押した所と離した所の共通の親で起きるので、板の上の文字を選んだ指を
// 背景で離すと target が .sheet になり、選んだだけで板が消える
let pressedOnBackdrop = false;
$('sheet').addEventListener('pointerdown', (e) => { pressedOnBackdrop = e.target === $('sheet'); });
$('sheet').addEventListener('click', (e) => { if (pressedOnBackdrop && e.target === $('sheet')) closeSheet(); });
$('sheet-close').addEventListener('click', closeSheet);
// 読んでいる時の Esc は**読むのを閉じる**。板より上に重なっているので先に受ける。
// 品書きはさらにその上なので、開いていれば一番先に受ける (開けただけで板ごと消えない)
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (volMenuOpen) closeVolMenu();
  else if (readerOpen()) closeReader();
  else if (sheetOpen()) closeSheet();
});

let qTimer = null;
$('q').addEventListener('input', (e) => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { state.q = e.target.value.trim(); loadGrid(); }, 250);
});

const toggle = (id, apply) => {
  $(id).addEventListener('click', () => {
    const on = $(id).getAttribute('aria-pressed') === 'true';
    $(id).setAttribute('aria-pressed', String(!on));
    apply(!on);
    loadGrid();
  });
};
toggle('f-gaps', (on) => { state.gaps = on; });
toggle('f-behind', (on) => { state.behind = on; });
toggle('f-nocover', (on) => { state.needsCover = on; });
toggle('f-issues', (on) => { state.issues = on; });
toggle('f-care', (on) => { state.care = on; });
toggle('f-done', (on) => {
  state.completed = on ? true : undefined;
  if (on) { $('f-ongoing').setAttribute('aria-pressed', 'false'); }
});
toggle('f-ongoing', (on) => {
  state.completed = on ? false : undefined;
  if (on) { $('f-done').setAttribute('aria-pressed', 'false'); }
});
$('sort').addEventListener('change', (e) => { state.sort = e.target.value; saveSort(state.sort); loadGrid(); });

// スマホでだけ出る ⋯。棚の読み直しと表紙の取得を畳んでおく (PC では常に出ている)
$('more').addEventListener('click', () => {
  const open = $('acts').dataset.open === '1';
  $('acts').dataset.open = open ? '' : '1';
  $('more').setAttribute('aria-expanded', String(!open));
});

$('scan').addEventListener('click', async () => {
  const b = $('scan');
  b.disabled = true;
  b.innerHTML = '<span class="spin"></span> 読み直し中';
  try {
    const { results } = await api('/api/scan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const r = results[0] ?? {};
    // **消えた分も言う。** 増えた数しか出さないと、棚から抜いたファイルに
    // 気づいていないように見える (実際は present を倒している)
    const bits = [`${r.filesSeen} ファイル`, `作品 +${r.seriesAdded}`, `巻 +${r.volumesAdded}`];
    if (r.gone) bits.push(`消えた ${r.gone}`);
    toast(r.error ? r.error : bits.join(' / '), 5000);
    await Promise.all([loadGrid(), loadNews(), loadStats()]);
    // 開いたままの板は貼り直さないと古いまま。**読み直しても中身が変わらない**所だった
    if (sheetOpen() && lastDetail) await openDetail(lastDetail.id, 'keep');
  } catch (e) { toast('失敗: ' + e.message, 5000); }
  b.disabled = false;
  b.textContent = '棚を読み直す';
});

$('names').addEventListener('click', () => openNamer());

(async () => {
  // 覚えている並び順を選択欄に戻す。**loadGrid より先** — 出てくる棚と欄の表示がずれる
  $('sort').value = state.sort;
  await Promise.all([loadStats(), loadNews(), loadGrid()]);
  const m = location.hash.match(/^#\/series\/(\d+)/);
  const r = location.hash.match(/^#\/read\/(\d+)/);
  // 入口がここなら積むものが無い。'entry' で置き換えるだけにして、
  // 戻るは素直に pinax の外へ出す (積んでおくと戻るが空振りする)
  if (r) openReader(Number(r[1]), 'entry');
  else if (m) openDetail(Number(m[1]), 'entry');
  else if (location.hash.startsWith('#/names')) openNamer('entry');
})();
</script>
</body>
</html>
