<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pinax — 蔵書</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23AD3D2B'/%3E%3Cpath d='M8 7h5.5c1.9 0 3 1 3 2.6V25H8zm8.5 2.6C16.5 8 17.6 7 19.5 7H24v18h-7.5z' fill='%23F6EFE7'/%3E%3C/svg%3E">
<style>
:root {
  --brand: #AD3D2B;
  --brand-dim: #8d3123;
  --brand-soft: #f6e7e3;
  --ink: #22201f;
  --ink-2: #5d5754;
  --ink-3: #8d8582;
  --bg: #faf7f3;
  --panel: #ffffff;
  --line: #e6ded6;
  --gap: #c2410c;
  --ok: #3f7d58;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(40,25,20,.06), 0 6px 18px rgba(40,25,20,.07);
}
@media (prefers-color-scheme: dark) {
  :root {
    --brand: #d05942;
    --brand-dim: #b9452f;
    --brand-soft: #3a221d;
    --ink: #ece6e1;
    --ink-2: #b5aba5;
    --ink-3: #867c77;
    --bg: #171412;
    --panel: #201b19;
    --line: #352d29;
    --gap: #e0703f;
    --ok: #6cae87;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
/**
 * **縦スクロールバーの幅を常に取っておく。**
 * 詳細の板を開く時に body のスクロールを止めるが、取っておかないと止めた瞬間に
 * バーが消えて画面が 15px ほど広がり、棚のカード (auto-fill) が一斉に少しだけ
 * 大きくなる。PC で「モーダルの下の画面がガタつく」のはこれ
 */
html { scrollbar-gutter: stable; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.6 "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brand); }

/* ---- ヘッダ ---- */
header {
  position: sticky; top: 0; z-index: 30;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.bar { display: flex; align-items: center; gap: 16px; padding: 12px 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.logo {
  font: 700 22px/1 "Palatino Linotype", "Hiragino Mincho ProN", serif;
  letter-spacing: .14em; color: var(--brand); text-transform: lowercase;
}
.tagline { font-size: 11px; color: var(--ink-3); letter-spacing: .04em; }
.stats { font-size: 12px; color: var(--ink-2); display: flex; gap: 14px; }
.stats b { color: var(--ink); font-weight: 600; }

.btn {
  border: 1px solid var(--line); background: var(--panel); color: var(--ink-2);
  border-radius: 8px; padding: 7px 13px; font-size: 13px; white-space: nowrap;
}
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-dim); color: #fff; }
.btn[disabled] { opacity: .5; cursor: default; }
.acts { display: flex; gap: 8px; }
#more { display: none; }

/* ---- 道具立て ---- */
.tools { display: flex; gap: 8px; padding: 0 20px 12px; flex-wrap: wrap; align-items: center; }
.search {
  flex: 1 1 240px; min-width: 180px; max-width: 420px;
  border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 12px;
}
.search:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: transparent; color: var(--ink-2);
  border-radius: 999px; padding: 6px 13px; font-size: 12.5px;
}
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
select.sort { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 10px; font-size: 13px; }

/* ---- お知らせ ---- */
.news { margin: 16px 20px 0; border: 1px solid var(--line); border-left: 3px solid var(--brand); border-radius: var(--radius); background: var(--panel); }
.news-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; font-size: 13px; font-weight: 600; }
.news-head .count { background: var(--brand); color: #fff; border-radius: 999px; padding: 1px 8px; font-size: 11px; }
.news ul { margin: 0; padding: 0 14px 12px; list-style: none; display: grid; gap: 6px; }
.news li { font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; }
.news li b { color: var(--ink); font-weight: 600; }
.news .kind { color: var(--brand); font-size: 11px; border: 1px solid var(--brand); border-radius: 4px; padding: 0 5px; align-self: center; }

/* ---- 棚 ---- */
main { padding: 16px 20px 60px; }
.count-line { font-size: 12px; color: var(--ink-3); margin: 4px 2px 12px; }
.grid {
  display: grid; gap: 18px 14px;
  grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
}
.card { background: none; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 7px; }
.cover {
  position: relative; aspect-ratio: 2 / 3; border-radius: 6px; overflow: hidden;
  background: linear-gradient(150deg, var(--brand-soft), var(--line));
  box-shadow: var(--shadow); display: grid; place-items: center;
}
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover .none {
  font: 600 11px/1.5 sans-serif; color: var(--ink-3); text-align: center; padding: 8px; word-break: break-word;
}
.card:hover .cover { outline: 2px solid var(--brand); outline-offset: 2px; }
.badges { position: absolute; top: 5px; left: 5px; right: 5px; display: flex; gap: 4px; flex-wrap: wrap; }
.badge { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; color: #fff; background: rgba(0,0,0,.55); backdrop-filter: blur(2px); }
.badge.gap { background: var(--gap); }
.badge.done { background: var(--ok); }
.c-title { font-size: 12.5px; font-weight: 600; line-height: 1.35; }
.c-meta { font-size: 11px; color: var(--ink-3); }

/* ---- 詳細 ----
   スマホでは下から生える板にする。**上に地の画面を覗かせたまま止める** —
   全画面に被せると、今開いているのが別の画面なのか作品の中なのか分からなくなる。
   中身は .sheet-body だけが動き、× を載せた頭は常に居座る (スクロールで逃げない) */
.sheet {
  position: fixed; inset: 0; z-index: 50; background: rgba(25,15,12,.5);
  display: flex; justify-content: center; align-items: flex-start; padding: 3vh 16px;
  overscroll-behavior: contain;
}
.sheet[hidden] { display: none; }
.sheet-inner {
  background: var(--panel); border-radius: 14px; box-shadow: var(--shadow);
  width: min(920px, 100%); max-height: 94vh;
  display: flex; flex-direction: column; overflow: hidden;
}
.sheet-head {
  flex: none; display: flex; align-items: center; gap: 10px;
  padding: 11px 12px 11px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
}
.sheet-head .grip { display: none; }
.sheet-title {
  flex: 1; min-width: 0; font-size: 13px; font-weight: 600; color: var(--ink-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.close {
  flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 8px;
  font-size: 19px; line-height: 1; color: var(--ink-2); padding: 6px 14px;
}
.close:hover { border-color: var(--brand); color: var(--brand); }
.sheet-body {
  overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: 20px;
}
.d-head { display: flex; gap: 20px; flex-wrap: wrap; }
.d-cover { width: 150px; flex: none; aspect-ratio: 2/3; border-radius: 8px; overflow: hidden; background: var(--brand-soft); box-shadow: var(--shadow); }
.d-cover img { width: 100%; height: 100%; object-fit: cover; }
.d-info { flex: 1 1 280px; min-width: 0; }
.d-info h2 { margin: 0 0 4px; font-size: 20px; line-height: 1.35; }
.d-author { color: var(--brand); font-size: 13px; font-weight: 600; margin-bottom: 10px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; color: var(--ink-2); }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; word-break: break-all; }
.gapline { margin: 12px 0 0; padding: 9px 12px; border-radius: 8px; background: var(--brand-soft); color: var(--gap); font-size: 13px; font-weight: 600; }
.d-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

h3.sec { font-size: 13px; color: var(--ink-3); font-weight: 600; margin: 24px 0 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.vols { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
.vol { display: flex; flex-direction: column; gap: 5px; }
.vol .cover { aspect-ratio: 2/3; }
.vol .lbl { font-size: 11.5px; font-weight: 600; text-align: center; }
.vol .sz { font-size: 10px; color: var(--ink-3); text-align: center; }
.vol .dl { font-size: 11px; text-align: center; border: 1px solid var(--line); border-radius: 5px; padding: 3px; text-decoration: none; color: var(--ink-2); display: block; }
.vol .dl:hover { border-color: var(--brand); color: var(--brand); }
.vol.missing .cover { background: repeating-linear-gradient(45deg, transparent, transparent 6px, var(--line) 6px, var(--line) 7px); box-shadow: none; border: 1px dashed var(--gap); }
.vol.missing .lbl { color: var(--gap); }
/* 手元の最大巻より先に出ている巻。欠番 (持っている範囲の中の穴) とは別色にする */
.vol.ahead .cover { background: repeating-linear-gradient(45deg, transparent, transparent 6px, var(--brand-soft) 6px, var(--brand-soft) 7px); box-shadow: none; border: 1px dashed var(--brand); }
.vol.ahead .lbl { color: var(--brand); }
.shelfline { margin: 10px 0 0; padding: 9px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; background: var(--brand-soft); color: var(--brand); }
.shelfline.quiet { background: transparent; border: 1px solid var(--line); color: var(--ink-3); font-weight: 500; }
.shelfline small { display: block; font-weight: 400; font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
.badge.ahead { background: var(--brand); }
.loose { font-size: 12px; color: var(--ink-2); display: grid; gap: 4px; }
.loose a { text-decoration: none; }

/* ---- 完結のスイッチ ---- */
.setrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; font-size: 13px; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.track {
  flex: none; width: 42px; height: 24px; border-radius: 999px; background: var(--line);
  position: relative; transition: background .15s;
}
.track::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.35);
  transition: transform .15s;
}
.switch input:checked + .track { background: var(--ok); }
.switch input:checked + .track::after { transform: translateX(18px); }
.switch input:focus-visible + .track { outline: 2px solid var(--brand); outline-offset: 2px; }
.switch input:disabled + .track { opacity: .5; }
.setnote { font-size: 11.5px; color: var(--ink-3); }

/**
 * pinax が動いている PC の側で起きること (エクスプローラ) の入口。
 *
 * **「出す条件」ではなく「隠す条件」を書く。** ここは 2 度外している:
 *
 *   1. 接続元アドレスで判定 (2026-09-14) — 手元は PC からも Tailscale の口を
 *      通して見ているので、接続元が pinax 自身のアドレスになるとは限らない
 *   2. `(hover: hover) and (pointer: fine)` で出す (2026-09-15) — 手元の Brave は
 *      hover / pointer / any-hover / any-pointer を**全部 false** で答える。
 *      `any-` を足しても救えず、PC で見ているのにボタンが消えたまま
 *
 * どちらも「PC だと分かった時だけ出す」書き方で、**判定できない環境が丸ごと
 * 「PC ではない」側へ落ちた**。逆に書く — 指しか無いと**はっきり分かった**時だけ
 * 隠し、分からなければ出す。起きるのは「PC にウィンドウが 1 枚開く」だけなので、
 * 出し過ぎより出ないことの方が重い (本人の指定)。
 */
.pc-only { display: inline-block; }
/* 指しか無い端末では意味が無いので隠す */
@media (any-pointer: coarse) { .pc-only { display: none; } }
/* ただしマウスも有るなら PC。タッチ画面付きのノートがここへ落ちる */
@media (any-pointer: coarse) and (any-pointer: fine) { .pc-only { display: inline-block; } }

/* ---- 要確認 (巻の重複・巻数不明) ---- */
.issueline { margin: 10px 0 0; padding: 9px 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
  background: var(--brand-soft); color: var(--gap); }
.issueline small { display: block; font-weight: 400; font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
.badge.warn { background: var(--gap); }
.vol.dup .cover { outline: 2px solid var(--gap); outline-offset: -2px; }
.filelist { display: grid; gap: 8px; font-size: 12px; }
.filelist .grp { display: grid; gap: 3px; }
.filelist .grp > b { font-size: 12px; color: var(--gap); font-weight: 600; }
.filelist .row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; color: var(--ink-2); }
.filelist .row .nm { word-break: break-all; flex: 1 1 240px; }
.filelist .row .sz { color: var(--ink-3); font-size: 11px; }
.filelist a { text-decoration: none; }
.mini { border: 1px solid var(--line); background: transparent; color: var(--ink-3); border-radius: 6px;
  padding: 2px 8px; font-size: 11px; white-space: nowrap; }
.mini:hover { border-color: var(--brand); color: var(--brand); }
.more { font-size: 11.5px; color: var(--ink-3); }

/* ---- 表紙を選ぶ ----
   詳細の板の中で中身だけ差し替える。もう 1 枚重ねると、Android の戻るで
   どちらが閉じるのか分からなくなる (詳細の板は履歴を 1 つ積んで開いている) */
.pk-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.pk-for { font-size: 13px; color: var(--ink-2); }
.pk-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.pk-form input { flex: 1 1 180px; min-width: 140px; border: 1px solid var(--line); background: var(--bg);
  border-radius: 8px; padding: 8px 12px; }
.pk-form input:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
.pk-note { font-size: 12px; color: var(--ink-3); margin-bottom: 12px; }
.pk-note.warn { color: var(--gap); }
.pk-now { margin: 0 0 14px; padding: 9px 12px; border-radius: 8px; background: var(--brand-soft);
  color: var(--brand); font-size: 13px; font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pk-now small { display: block; font-weight: 400; font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }

.pk-group { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.pk-g-cover { flex: none; width: 64px; aspect-ratio: 2/3; border-radius: 5px; overflow: hidden;
  background: var(--brand-soft); display: grid; place-items: center; }
.pk-g-cover img { width: 100%; height: 100%; object-fit: cover; }
.pk-g-info { flex: 1 1 auto; min-width: 0; }
.pk-g-title { font-size: 14px; font-weight: 600; line-height: 1.35; word-break: break-word; }
.pk-g-meta { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
.pk-g-acts { display: flex; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
.pk-tag { font-size: 10px; font-weight: 600; border: 1px solid var(--line); border-radius: 4px;
  padding: 1px 5px; color: var(--ink-3); vertical-align: 2px; margin-left: 6px; }
.pk-group.on { background: var(--brand-soft); border-radius: 8px; padding: 12px; }

.pk-g-cover, .pk-item .cover { position: relative; }
/* 書影の無い候補は書名が板に出る。64px の枠に長い書名が来るので、ここだけ詰める */
.pk-g-cover .none { font-size: 9px; line-height: 1.3; padding: 4px; max-height: 100%; overflow: hidden; }
.pk-item .none { font-size: 10px; }
.pk-g-cover img.over, .pk-item .cover img.over { position: absolute; inset: 0; }
.pk-items { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
  padding: 4px 0 14px; }
.pk-item { display: flex; flex-direction: column; gap: 4px; }
.pk-item .cover { aspect-ratio: 2/3; }
.pk-item .lbl { font-size: 11px; font-weight: 600; text-align: center; }
.pk-item .sub { font-size: 10px; color: var(--ink-3); text-align: center; word-break: break-word; }

/* 表紙そのものを押して選び直せるようにする。span を button にしただけなので枠を消す */
button.cover { border: 0; padding: 0; font: inherit; }
.vol button.cover:hover { outline: 2px solid var(--brand); outline-offset: 2px; }
.badge.pinned { background: var(--ok); }

.empty { text-align: center; color: var(--ink-3); padding: 60px 20px; }
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 80;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow);
}
.toast[hidden] { display: none; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- スマホ ----
   詳細は下から生える板。上を 12dvh ほど空けて地の画面を残す (何かの上に乗っていると分かる)。
   dvh はアドレスバーの伸縮に追従する — vh だけだと板の底がバーの裏に隠れて × に指が届かない */
@media (max-width: 640px) {
  /* ヘッダは 2 段まで。棚を見に来ているので、道具立てに画面の 1/3 を渡さない */
  .bar { padding: 9px 14px; gap: 10px; }
  .logo { font-size: 18px; }
  .tagline { display: none; }
  .stats { font-size: 11px; gap: 9px; }
  #more { display: inline-block; padding: 5px 11px; letter-spacing: .1em; }
  /* 棚の読み直しと表紙の取得は ⋯ の下へ畳む。毎回押すものではない */
  .acts { display: none; flex: 1 0 100%; }
  .acts[data-open="1"] { display: flex; }
  .acts .btn { flex: 1; }

  .tools { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 0 14px 10px; }
  .search { grid-area: 1 / 1; max-width: none; min-width: 0; padding: 7px 11px; }
  select.sort { grid-area: 1 / 2; padding: 7px 8px; }
  /* 絞り込みは 1 行に並べて横へ流す。折り返すと段が増えて棚が押し出される */
  .chips { grid-area: 2 / 1 / 3 / 3; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 5px 12px; }

  .sheet { padding: 0; align-items: flex-end; }
  .sheet-inner {
    width: 100%; max-height: 88vh; max-height: 88dvh;
    border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px rgba(25,15,12,.28);
  }
  .sheet-head { flex-wrap: wrap; padding: 7px 10px 10px 16px; }
  .sheet-head .grip {
    display: block; flex: 1 0 100%; height: 4px; width: 40px; margin: 0 auto 7px;
    border-radius: 99px; background: var(--line);
  }
  .sheet-body { padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
  .d-cover { width: 108px; }
  .d-info h2 { font-size: 17px; }
  .bar { padding: 10px 14px; gap: 10px; }
  .tools { padding: 0 14px 10px; }
  main { padding: 14px 14px 48px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px 10px; }
  .news { margin: 12px 14px 0; }
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">
      <span class="logo">pinax</span>
      <span class="tagline">Never burn. Remember Alexandria.</span>
    </div>
    <div class="stats" id="stats"></div>
    <button class="btn" id="more" aria-expanded="false" aria-controls="acts" aria-label="棚の操作">···</button>
    <div class="acts" id="acts">
      <button class="btn" id="scan">棚を読み直す</button>
      <button class="btn" id="fill">表紙を進める</button>
    </div>
  </div>
  <div class="tools">
    <input class="search" id="q" type="search" placeholder="作品名・著者で探す" autocomplete="off">
    <div class="chips">
      <button class="chip" id="f-gaps" aria-pressed="false">欠番あり</button>
      <button class="chip" id="f-behind" aria-pressed="false">続きが出ている</button>
      <button class="chip" id="f-done" aria-pressed="false">完結</button>
      <button class="chip" id="f-ongoing" aria-pressed="false">継続中</button>
      <button class="chip" id="f-nocover" aria-pressed="false">表紙なし</button>
      <button class="chip" id="f-issues" aria-pressed="false">要確認</button>
    </div>
    <select class="sort" id="sort">
      <option value="title">作品名順</option>
      <option value="author">著者順</option>
      <option value="volumes">冊数順</option>
      <option value="added">登録が新しい順</option>
      <option value="updated">更新が新しい順</option>
    </select>
  </div>
</header>

<div id="news"></div>

<main>
  <div class="count-line" id="countline"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>見つかりませんでした</div>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-inner" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <span class="grip" aria-hidden="true"></span>
      <span class="sheet-title" id="sheet-title"></span>
      <button class="close" id="sheet-close" aria-label="閉じる">&times;</button>
    </div>
    <div class="sheet-body" id="detail"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mb = (n) => n >= 1 << 30 ? (n / (1 << 30)).toFixed(1) + ' GB' : (n / (1 << 20)).toFixed(0) + ' MB';

let toastTimer = null;
function toast(msg, ms = 3000) {
  const t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, ms);
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || `${r.status}`);
  return body;
}

const state = { q: '', gaps: false, behind: false, completed: undefined, needsCover: false, issues: false, sort: 'title' };

/**
 * この端末で pinax が何をできるか。/api/health が**接続元ごとに**答える。
 * エクスプローラは pinax が動いている PC からしか開けないので、
 * スマホで見ている時はボタンそのものを出さない (押せるのに何も起きないのが一番困る)。
 */
const caps = { reveal: { available: false, reason: null } };

// ---- 棚 ----------------------------------------------------------------

function coverHtml(url, fallback) {
  return url
    ? `<img loading="lazy" src="${url}" alt="">`
    : `<span class="none">${esc(fallback)}</span>`;
}

function cardHtml(s) {
  const h = s.holdings[0];
  const badges = [];
  if (s.hasGap) badges.push(`<span class="badge gap">欠番 ${s.holdings.reduce((n, x) => n + x.missing.length, 0)}</span>`);
  // 手元の最大巻より先が出ている。**欠番とは意味が違う** ので別に出す
  if (s.shelf && s.shelf.aheadCount) badges.push(`<span class="badge ahead">+${s.shelf.aheadCount}</span>`);
  if (s.issues && s.issues.any) badges.push('<span class="badge warn">要確認</span>');
  if (s.completed) badges.push('<span class="badge done">完</span>');
  const range = h ? `1〜${h.max}${h.unit}` : (s.looseFiles ? `${s.looseFiles}点` : '');
  return `<button class="card" data-id="${s.id}">
    <span class="cover">${coverHtml(s.coverUrl, s.title)}
      ${badges.length ? `<span class="badges">${badges.join('')}</span>` : ''}</span>
    <span class="c-title">${esc(s.title)}</span>
    <span class="c-meta">${esc(s.author ?? '著者不明')}${range ? ' · ' + range : ''}</span>
  </button>`;
}

async function loadGrid() {
  const p = new URLSearchParams({ sort: state.sort, limit: '500' });
  if (state.q) p.set('q', state.q);
  if (state.gaps) p.set('gaps', '1');
  if (state.behind) p.set('behind', '1');
  if (state.completed !== undefined) p.set('completed', state.completed ? '1' : '0');
  if (state.needsCover) p.set('needsCover', '1');
  if (state.issues) p.set('issues', '1');

  const { total, items } = await api('/api/series?' + p);
  $('grid').innerHTML = items.map(cardHtml).join('');
  $('empty').hidden = items.length > 0;
  const shown = items.length;
  $('countline').textContent = state.behind
    ? `続きが出ている作品 ${shown} 件`
    : state.gaps
      ? `欠番のある作品 ${shown} 件`
      : state.issues
        ? `要確認の作品 ${shown} 件 — 同じ巻に複数のファイル、または何巻か読めないファイルがあります`
        : `${shown} 件を表示${total > shown ? ` (該当 ${total} 件)` : ''}`;
}

// ---- 詳細 ---------------------------------------------------------------

function volHtml(v) {
  const f = v.files[0];
  const size = v.files.reduce((n, x) => n + x.size, 0);
  const tags = v.files.flatMap((x) => x.tags);
  const dl = v.files.length === 1
    ? `<a class="dl" href="/api/files/${f.id}/download">保存</a>`
    : `<a class="dl" href="/api/files/${f.id}/download">保存 (1/${v.files.length})</a>`;
  const marks = [];
  if (v.duplicate) marks.push('<span class="badge warn">複</span>');
  if (v.coverPinned) marks.push('<span class="badge pinned">選</span>');
  if (v.completed) marks.push('<span class="badge done">完</span>');
  // 単巻なら表紙そのものが「選び直す」の入口。合本 (範囲もの) は 1 巻に結び付かないので押せない
  const single = v.volumeFrom === v.volumeTo;
  const inner = `${coverHtml(v.coverUrl, v.label)}
      ${marks.length ? `<span class="badges">${marks.join('')}</span>` : ''}`;
  const cover = single
    ? `<button class="cover" data-cover-vol="${v.volumeFrom}" title="この巻の表紙を選び直す">${inner}</button>`
    : `<span class="cover">${inner}</span>`;
  return `<div class="vol${v.duplicate ? ' dup' : ''}">
    ${cover}
    <span class="lbl">${esc(v.label)}${tags.length ? ' ' + esc(tags.join(',')) : ''}</span>
    <span class="sz">${mb(size)}</span>
    ${dl}
  </div>`;
}

function missingVolHtml(n, unit, kind) {
  // kind: 'gap' = 持っている範囲の中の穴 / 'ahead' = 手元の最大巻より先に出ている巻
  return `<div class="vol missing ${kind === 'ahead' ? 'ahead' : ''}">
    <span class="cover"></span>
    <span class="lbl">第${String(n).padStart(2, '0')}${unit}</span>
    <span class="sz">${kind === 'ahead' ? '未購入' : '未所持'}</span>
  </div>`;
}

/**
 * 発行状況の一行。**「たぶん完結」とは書かない。**
 * 外の書誌に完結の情報が無いことは実測済みで、機械が断定して外すと買い逃しになる。
 * 分かっていることだけを出して、判断は人に委ねる。
 */
function shelfLineHtml(d) {
  const sh = d.shelf;
  const pub = d.published;
  if (!sh) return '';
  const src = pub && pub.providers && pub.providers.length ? pub.providers.join('・').toUpperCase() : '書誌';
  if (sh.status === 'unknown') {
    return `<div class="shelfline quiet">発行状況は未確認<small>「書誌と表紙を取り直す」で外に聞きます</small></div>`;
  }
  if (sh.status === 'behind') {
    return `<div class="shelfline">続きが出ています — 第${sh.ownedMax + 1}〜${sh.publishedMax}巻が未購入
      <small>${esc(src)} で確認できた範囲です。これより先が出ている可能性もあります</small></div>`;
  }
  if (sh.status === 'owner-completed') {
    // 完結と言っているのが誰かを必ず添える。フォルダの印なのか自分で指定したのかで、
    // 「本当に完結か」を疑う時の当たり先が変わる
    const by = sh.completedBy === 'user' ? 'この画面で指定' : 'フォルダの (完)';
    return `<div class="shelfline quiet">完結（${by}）${
      sh.missingCount ? ` — 未所持 ${sh.missingCount}巻` : ' — 揃っています'
    }<small>${esc(src)} で第${sh.publishedMax ?? '?'}巻まで確認</small></div>`;
  }
  return `<div class="shelfline quiet">${
    sh.latestYear ? `${sh.latestYear}年の第${sh.publishedMax}巻` : `第${sh.publishedMax}巻`
  }まで確認、それ以降は不明<small>完結したのか、書誌がまだ新刊を知らないのかは区別できません</small></div>`;
}

function detailHtml(d) {
  const bib = d.bib ?? {};
  const gapText = d.holdings
    .filter((h) => h.missing.length)
    .map((h) => `${h.unit}: ${h.missing.join(', ')}`)
    .join(' / ');

  // 持っている巻と欠番を 1 本の数直線に並べる。歯抜けが目で見える形にする
  const main = d.holdings.find((h) => h.unit === '巻') ?? d.holdings[0];
  // 数直線に置くのは単巻だけ。**合本 (第01-02巻) を混ぜてはいけない** —
  // 混ぜると volumeFrom の位置で 1 度描かれ、下の「後ろに足す」でもう 1 度描かれて
  // 同じ巻が 2 枚並ぶ。単巻の第01巻と合本の第01-02巻を両方持っている時は
  // 後から入れた合本が単巻を Map から押し出し、単巻の方が消える
  const owned = new Map();
  for (const v of d.volumes) {
    if (main && v.unit !== main.unit) continue;
    if (v.volumeFrom !== v.volumeTo) continue;
    owned.set(v.volumeFrom, v);
  }
  const line = [];
  // 数直線に描いた巻。後ろに足す時、同じ巻を二度出さないための印
  const placed = new Set();
  if (main) {
    /**
     * **手元の最大巻で数直線を止めない。** 外の書誌が知っている巻まで伸ばす。
     * 止めてしまうと「1〜10巻が揃っている」ように見えて、19巻まで出ていることに
     * 一生気付けない — 蔵書管理として一番まずい見え方になる。
     */
    const pub = d.published ?? { max: null, known: [] };
    const knownSet = new Set(pub.known ?? []);
    const last = main.unit === '巻' && pub.max ? Math.max(main.max, pub.max) : main.max;
    for (let i = 1; i <= last; i++) {
      const v = owned.get(i);
      if (v) { line.push(volHtml(v)); placed.add(v.id); continue; }
      // 合本の中の番号。その巻は下で合本 1 枚として出るので、ここでは欠番にしない
      if (d.volumes.some((x) => x.unit === main.unit && x.volumeFrom <= i && x.volumeTo >= i)) continue;
      // 手元の最大巻より先は「未購入」。書誌が知らない番号は出さない (あるとは限らない)
      if (i > main.max) { if (knownSet.has(i)) line.push(missingVolHtml(i, main.unit, 'ahead')); }
      else line.push(missingVolHtml(i, main.unit, 'gap'));
    }
    // 数直線に乗らなかった巻を後ろに足す — 合本 (第01-02巻) と、
    // 別単位の巻 (巻で数える作品に 1 つだけ混ざった「第224話」など)。
    // **ここで落とすと、持っているのに画面から消える**
    for (const v of d.volumes) if (!placed.has(v.id)) line.push(volHtml(v));
  } else {
    for (const v of d.volumes) line.push(volHtml(v));
  }

  return `
  <div class="d-head">
    <div class="d-cover">${coverHtml(d.coverUrl, d.title)}</div>
    <div class="d-info">
      <h2>${esc(d.title)}${d.completed ? ' <span class="badge done">完結</span>' : ''}</h2>
      <div class="d-author">${esc(d.author ?? '著者不明')}</div>
      <dl class="kv">
        <dt>所持</dt><dd>${d.fileCount} 冊 · ${mb(d.bytes)}${d.looseFiles ? ` (巻数不明 ${d.looseFiles} 点)` : ''}</dd>
        ${bib.publisher ? `<dt>出版</dt><dd>${esc(bib.publisher)}${bib.pubdate ? ` (${esc(bib.pubdate)})` : ''}</dd>` : ''}
        ${bib.isbn ? `<dt>ISBN</dt><dd>${esc(bib.isbn)}</dd>` : ''}
        <dt>フォルダ</dt><dd>${esc(d.folder)}</dd>
      </dl>
      ${gapText ? `<div class="gapline">欠番 ${esc(gapText)}</div>` : ''}
      ${shelfLineHtml(d)}
      ${issueLineHtml(d)}
      ${completedSwitchHtml(d)}
      ${pickLineHtml(d)}
      <div class="d-actions">
        <button class="btn" id="enrich" data-id="${d.id}">書誌と表紙を取り直す</button>
        <button class="btn" id="pick-open">表紙を探して選ぶ</button>
        ${caps.reveal.available ? '<button class="btn pc-only" id="reveal">エクスプローラで開く</button>' : ''}
      </div>
    </div>
  </div>
  <h3 class="sec">巻 <span style="font-weight:400">— 表紙を押すとその巻だけ選び直せます</span></h3>
  <div class="vols">${line.join('')}</div>
  ${dupSectionHtml(d)}
  ${d.loose.length ? `<h3 class="sec">巻数を読めなかったファイル</h3>
    <div class="filelist">${d.loose.map((f) => fileRowHtml(f)).join('')}</div>` : ''}
  `;
}

/**
 * 要確認の一行。**「直しました」ではなく「ここが怪しい」までしか言わない。**
 * 別版として両方置いているのか捨て漏れなのかは中身を見た人しか決められない。
 */
function issueLineHtml(d) {
  const is = d.issues;
  if (!is || !is.any) return '';
  const parts = [];
  if (is.duplicateVolumes) parts.push(`同じ巻に複数のファイル ${is.duplicateVolumes}巻 (余分 ${is.duplicateFiles}点)`);
  if (is.unreadableFiles) parts.push(`何巻か読めないファイル ${is.unreadableFiles}点`);
  return `<div class="issueline">要確認 — ${esc(parts.join(' / '))}
    <small>どれを残すかは中身を見て決めてください。pinax はファイルを消しません</small></div>`;
}

/**
 * 今どの書誌シリーズを見ているか。
 *
 * **選んでいない時は何も出さない。** 9 割の作品は自動で当たっていて、
 * そこに毎回「自動です」と書いても場所を食うだけ。出すのは人が選んだ時だけにして、
 * 「これは自分で決めたものだ」と分かるようにする。
 */
function pickLineHtml(d) {
  if (!d.pick) return '';
  const src = { ndl: 'NDLサーチ', rakuten: '楽天ブックス', google: 'Google Books' }[d.pick.scope] ?? '全部';
  return `<div class="pk-now">選んだシリーズ: ${esc(d.pick.title)}
    <span class="pk-tag">${esc(src)}</span>
    <button class="mini" id="pick-clear" style="margin-left:auto">自動に戻す</button>
    <small>この作品は書名から自動で当てず、この系列だけを見ます</small></div>`;
}

/**
 * 完結の入り / 切り。
 *
 * まだ触っていない作品はフォルダ名の `(完)` の答えがそのまま入っている。
 * 触った時だけ人の指定として別の列に残る (フォルダ名は書き換えない) ので、
 * 添え書きで**今どちらを見ているか**だけ知らせる。
 */
function completedSwitchHtml(d) {
  const note = d.completedUser !== null
    ? '手で指定'
    : d.folderCompleted ? 'フォルダ名の (完) から' : '';
  return `<div class="setrow">
    <label class="switch">
      <input type="checkbox" id="sw-completed"${d.completed ? ' checked' : ''}>
      <span class="track"></span>
      <span>完結済み</span>
    </label>
    ${note ? `<span class="setnote">${note}</span>` : ''}
  </div>`;
}

/** ファイル 1 本の行。保存と、PC なら置き場所を開く口を添える */
function fileRowHtml(f) {
  return `<div class="row">
    <span class="nm"><a href="/api/files/${f.id}/download">${esc(f.relPath)}</a></span>
    <span class="sz">${mb(f.size)}</span>
    ${caps.reveal.available ? `<button class="mini pc-only" data-reveal-file="${f.id}">場所</button>` : ''}
  </div>`;
}

/** 同じ巻に複数のファイルがある巻を並べる。多い作品があるので頭から 12 巻だけ出す */
function dupSectionHtml(d) {
  const dups = d.volumes.filter((v) => v.duplicate);
  if (!dups.length) return '';
  const shown = dups.slice(0, 12);
  return `<h3 class="sec">同じ巻に複数のファイル</h3>
  <div class="filelist">
    ${shown.map((v) => `<div class="grp"><b>${esc(v.label)}</b>${v.files.map(fileRowHtml).join('')}</div>`).join('')}
    ${dups.length > shown.length ? `<div class="more">ほか ${dups.length - shown.length} 巻</div>` : ''}
  </div>`;
}

/**
 * 詳細を開く。
 *
 * **履歴を 1 つ積んでから開く。** Android の戻るでモーダルだけが閉じるようにするため。
 * 以前は `location.hash` を書き換えるだけだったので、戻るの 1 回目は URL が変わるだけで
 * モーダルが開いたまま残り、2 回目で pinax そのものから出ていた。
 *
 *   mode 'push'  … 棚から開いた。戻るで閉じられる
 *   mode 'entry' … `#/series/5` を直接開いた。積むものが無いので置き換える
 *                  (この時だけは戻るで pinax を出る — それが正しい戻り先)
 *   mode 'keep'  … 中身の貼り直し。履歴もスクロール位置も動かさない
 */
let lastDetail = null;

async function openDetail(id, mode = 'push') {
  const refresh = mode === 'keep';
  if (!refresh) {
    $('detail').innerHTML = '<div class="empty"><span class="spin"></span> 読み込み中</div>';
    $('sheet-title').textContent = '読み込み中';
  }
  showSheet();
  const url = '#/series/' + id;
  if (mode === 'push') history.pushState({ sheetId: id }, '', url);
  else if (mode === 'entry') history.replaceState({ sheetId: id, entry: true }, '', url);

  const top = $('detail').scrollTop;
  const d = await api('/api/series/' + id);
  lastDetail = d;
  $('sheet-title').textContent = d.label || d.title;
  $('detail').innerHTML = detailHtml(d);
  $('detail').scrollTop = refresh ? top : 0;
  wireDetail(d);
}

/** 詳細の中のボタンを繋ぐ。中身を貼り直すたびに呼ぶ */
function wireDetail(d) {
  const id = d.id;

  $('enrich')?.addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> 取得中';
    try {
      const r = await api(`/api/series/${id}/enrich`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh: true }),
      });
      toast(`NDL ${r.recordCount} 件 / 書誌 ${r.bibWritten} / 表紙 ${r.coversWritten} 枚`);
      await openDetail(id, 'keep');
      await loadGrid();
    } catch (err) {
      toast('失敗: ' + err.message, 5000);
      btn.disabled = false;
      btn.textContent = '書誌と表紙を取り直す';
    }
  });

  // 完結の入り / 切り
  $('sw-completed')?.addEventListener('change', async (e) => {
    const el = e.currentTarget;
    const value = el.checked;
    el.disabled = true;
    try {
      await api(`/api/series/${id}/completed`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ completed: value }),
      });
      toast(value ? '完結にしました' : '完結を外しました');
      await openDetail(id, 'keep');
      await loadGrid();
    } catch (err) {
      toast('失敗: ' + err.message, 5000);
      el.checked = !value;  // 通らなかったのに入ったままにしない
      el.disabled = false;
    }
  });

  // 表紙を探して選ぶ。作品まるごとと、巻 1 つぶんの 2 つの入口がある
  $('pick-open')?.addEventListener('click', () => openPicker(null));
  $('detail').querySelectorAll('button[data-cover-vol]').forEach((b) => {
    b.addEventListener('click', () => openPicker(Number(b.dataset.coverVol)));
  });

  // 選んだシリーズを外して自動へ戻す。**表紙はそのまま残す** — 次の取り直しで貼り替わる
  $('pick-clear')?.addEventListener('click', async () => {
    try {
      await api(`/api/series/${id}/cover-pick`, { method: 'DELETE' });
      toast('自動に戻しました。「書誌と表紙を取り直す」で当て直せます', 5000);
      await openDetail(id, 'keep');
    } catch (e) {
      toast('失敗: ' + e.message, 5000);
    }
  });

  // エクスプローラ。PC から見ている時しかボタンが無い (caps.reveal)
  $('reveal')?.addEventListener('click', () => reveal(id, null));
  $('detail').querySelectorAll('button[data-reveal-file]').forEach((b) => {
    b.addEventListener('click', () => reveal(id, Number(b.dataset.revealFile)));
  });
}

/** pinax が動いている PC でフォルダを開く。fileId を渡すとそのファイルを選択した状態で開く */
async function reveal(id, fileId) {
  try {
    await api(`/api/series/${id}/reveal`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(fileId ? { fileId } : {}),
    });
    toast('エクスプローラで開きました');
  } catch (e) {
    toast('開けません: ' + e.message, 5000);
  }
}

// ---- 表紙を選ぶ ---------------------------------------------------------

/**
 * **同じ書名で別のシリーズが並走している作品を、人が直す場所。**
 *
 * 血界戦線を NDL に聞くと、無印 / Back 2 Back / Beat 3 Peat が 1 つの答えに混ざって返る。
 * 機械には手元の棚がどれなのか分からないので、束ねて並べて「これ」と選ばせる
 * (src/bib/candidates.ts の頭)。
 *
 * 板はもう 1 枚重ねない。**詳細の中身だけを差し替える** — 詳細は履歴を 1 つ積んで
 * 開いているので、上にもう 1 枚乗せると Android の戻るでどちらが閉じるのか分からなくなる。
 */
const picker = {
  seriesId: null, volume: null, q: '', author: '', provider: 'all',
  groups: [], open: new Set(), pick: null, note: '', warn: false, body: '',
};

const volLabel = (n) => `第${String(n).padStart(2, '0')}巻`;

/** 束に付く提供元の印。**openBD は並ばない** — ISBN 起点でしか引けないので候補を出せない */
const PROVIDER_LABEL = { ndl: 'NDL', rakuten: '楽天', google: 'Google' };

/** 候補の画像は pinax が中継する。NDL は Referer を見て弾くので、ブラウザからは引けない */
const thumbUrl = (u) => '/api/bib/thumb?u=' + encodeURIComponent(u);

/** 書名の板を敷いて、その上に下見の画像を重ねる。取れなければ img だけ消えて板が残る */
function pkCover(url, fallback) {
  const none = `<span class="none">${esc(fallback)}</span>`;
  return url ? `${none}<img loading="lazy" class="over" src="${thumbUrl(url)}" alt="" onerror="this.remove()">` : none;
}

function pkItemHtml(c) {
  // 巻を指定して開いている時は、候補が何巻であろうとその巻へ貼る
  const target = picker.volume !== null ? picker.volume : c.volume;
  const label = c.volume === null ? '巻なし' : volLabel(c.volume);
  const use = (t, label) =>
    `<button class="mini" data-use="${esc(c.imageUrl)}" data-provider="${esc(c.provider)}"
      data-isbn="${esc(c.isbn ?? '')}" data-target="${t === null ? '' : t}">${label}</button>`;
  /**
   * 巻に貼る口と、棚に並ぶ 1 枚 (代表表紙) に貼る口を両方出す。
   * **代表は「持っている中で一番若い巻」から勝手に決まる** ので、第1-2巻が合本の作品では
   * 第4巻の絵が棚に並ぶ。そこを手で直せる口が要る
   */
  const btn = !c.imageUrl
    ? '<span class="sub">書影なし</span>'
    : target === null
      ? use(null, '代表表紙にする')
      : use(target, volLabel(target) + 'に使う') + (picker.volume === null ? use(null, '代表にする') : '');
  return `<div class="pk-item">
    <span class="cover">${pkCover(c.imageUrl, label)}</span>
    <span class="lbl">${esc(label)}</span>
    <span class="sub">${esc(c.title)}</span>
    <span class="sub">${esc(c.date ?? '')}</span>
    ${btn}
  </div>`;
}

function pkGroupHtml(g) {
  const on = picker.pick && picker.pick.groupKey === g.key;
  const years = g.firstYear
    ? (g.lastYear && g.lastYear !== g.firstYear ? `${g.firstYear}〜${g.lastYear}年` : `${g.firstYear}年`)
    : '';
  const vols = g.volumeMax
    ? `${volLabel(g.volumes[0])}〜${volLabel(g.volumeMax)} (${g.volumes.length}冊)`
    : '巻の並びなし';
  const meta = [g.author, years, vols, g.publisher, `${g.count}件`].filter(Boolean).join(' · ');
  const acts = [];
  // 巻を指定して開いている時は「シリーズごと乗り換える」を出さない。
  // 押したつもりの無い作品全体の貼り直しが走るのは驚きが大きい
  if (picker.volume === null) {
    acts.push(`<button class="btn primary" data-pick="${esc(g.key)}">このシリーズにする</button>`);
  }
  acts.push(`<button class="mini" data-open="${esc(g.key)}">${picker.open.has(g.key) ? '巻を閉じる' : '巻を見る'}</button>`);

  return `<div class="pk-group${on ? ' on' : ''}">
    <span class="pk-g-cover">${pkCover(g.coverUrl, g.title)}</span>
    <div class="pk-g-info">
      <div class="pk-g-title">${esc(g.title)}
        ${g.providers.map((x) => `<span class="pk-tag">${PROVIDER_LABEL[x] ?? x}</span>`).join('')}
        ${on ? '<span class="pk-tag">選択中</span>' : ''}</div>
      <div class="pk-g-meta">${esc(meta)}</div>
      <div class="pk-g-acts">${acts.join('')}</div>
    </div>
  </div>
  ${picker.open.has(g.key) ? `<div class="pk-items">${g.items.map(pkItemHtml).join('')}</div>` : ''}`;
}

function renderPicker() {
  // 巻を指定して来た時だけ、何をしに来たのかを出す。**それ以外の説明書きは置かない** —
  // 並んでいるものを見れば分かることを毎回読ませない
  const forWhat = picker.volume === null ? '' : `${volLabel(picker.volume)}の表紙だけを差し替えます`;
  $('detail').innerHTML = `
    <div class="pk-head">
      <button class="btn" id="pk-back">← 作品へ戻る</button>
      ${forWhat ? `<span class="pk-for">${forWhat}</span>` : ''}
    </div>
    <div class="pk-form">
      <input id="pk-q" value="${esc(picker.q)}" placeholder="作品名" autocomplete="off">
      <input id="pk-author" value="${esc(picker.author)}" placeholder="著者" autocomplete="off">
      <select class="sort" id="pk-provider">
        <option value="all">全部に聞く</option>
        <option value="ndl">NDL だけ</option>
        <option value="rakuten">楽天だけ</option>
        <option value="google">Google だけ</option>
      </select>
      <button class="btn primary" id="pk-go">探す</button>
    </div>
    ${picker.note ? `<div class="pk-note${picker.warn ? ' warn' : ''}">${esc(picker.note)}</div>` : ''}
    ${picker.body}`;
  $('pk-provider').value = picker.provider;
  wirePicker();
}

async function openPicker(volume = null) {
  const d = lastDetail;
  if (!d) return;
  picker.seriesId = d.id;
  picker.volume = volume;
  // 前に選んだ時の検索語があればそれを出す。無ければ棚の作品名と著者。
  // **空で選んだ人は空のまま出す** (著者だけで引き当てた作品がある)
  picker.q = d.pick ? d.pick.queryTitle : d.title;
  picker.author = d.pick ? (d.pick.queryAuthor || '') : (d.author || '');
  picker.provider = 'all';
  picker.groups = [];
  picker.open = new Set();
  picker.pick = d.pick ?? null;
  $('sheet-title').textContent = `${d.label || d.title} — 表紙を選ぶ`;
  await runPickerSearch();
}

async function runPickerSearch(refresh) {
  picker.note = '';
  picker.warn = false;
  picker.body = '<div class="empty"><span class="spin"></span> 外に聞いています</div>';
  renderPicker();

  try {
    const p = new URLSearchParams({ q: picker.q, author: picker.author, provider: picker.provider });
    if (refresh) p.set('refresh', '1');
    const r = await api(`/api/series/${picker.seriesId}/cover-search?` + p);
    picker.pick = r.pick;
    picker.groups = r.groups;

    // 開いておくものを決める。選択中のものがあればそれ、無ければ一番巻の揃っているもの。
    // **巻を指定して来た時は必ず 1 つ開く** — 候補を見に来たのに畳まれていては用を成さない
    const chosen = r.groups.find((g) => r.pick && g.key === r.pick.groupKey);
    const head = chosen ?? r.groups[0];
    const openHead = picker.volume !== null || r.groups.length === 1;
    picker.open = new Set(openHead && head ? [head.key] : chosen ? [chosen.key] : []);

    // **うまくいった時は何も言わない。** 言うのは相手が落ちていた時と、0 件だった時だけ
    const errs = (r.errors ?? []).map((e) => `${e.provider}: ${e.message}`).join(' / ');
    picker.warn = Boolean(errs);
    picker.note = r.groups.length
      ? errs
      : `候補が見つかりませんでした${errs ? ` — ${errs}` : ''}`;
    picker.body = r.groups.length
      ? r.groups.map(pkGroupHtml).join('')
      : '<div class="empty">検索語を変えて探し直してください</div>';
  } catch (e) {
    picker.warn = true;
    picker.note = '失敗: ' + e.message;
    picker.body = '';
  }
  renderPicker();
}

function wirePicker() {
  $('pk-back').addEventListener('click', () => openDetail(picker.seriesId, 'keep'));
  $('pk-go').addEventListener('click', () => {
    picker.q = $('pk-q').value.trim();
    picker.author = $('pk-author').value.trim();
    picker.provider = $('pk-provider').value;
    runPickerSearch();
  });
  for (const id of ['pk-q', 'pk-author']) {
    $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') $('pk-go').click(); });
  }

  $('detail').querySelectorAll('button[data-open]').forEach((b) => {
    b.addEventListener('click', () => {
      const k = b.dataset.open;
      if (picker.open.has(k)) picker.open.delete(k);
      else picker.open.add(k);
      picker.body = picker.groups.map(pkGroupHtml).join('');
      renderPicker();
    });
  });

  $('detail').querySelectorAll('button[data-pick]').forEach((b) => {
    b.addEventListener('click', () => choosePickedGroup(b));
  });
  $('detail').querySelectorAll('button[data-use]').forEach((b) => {
    b.addEventListener('click', () => useOneCover(b));
  });
}

/**
 * シリーズごと乗り換える。**書誌も表紙も貼り直す** ので、持っている巻の数だけ外を叩く。
 * 相手には間を空けて聞く決まりなので 10 巻で十数秒かかる — 押した後は必ず印を出す。
 */
async function choosePickedGroup(btn) {
  const key = btn.dataset.pick;
  const g = picker.groups.find((x) => x.key === key);
  if (!g) return;

  const all = $('detail').querySelectorAll('button[data-pick], button[data-use]');
  all.forEach((b) => { b.disabled = true; });
  btn.innerHTML = '<span class="spin"></span> 貼り直しています';
  try {
    const r = await api(`/api/series/${picker.seriesId}/cover-pick`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        scope: picker.provider, groupKey: key, title: g.title,
        queryTitle: picker.q, queryAuthor: picker.author,
      }),
    });
    toast(`${g.title} にしました — 書誌 ${r.result.bibWritten} / 表紙 ${r.result.coversWritten} 枚`, 5000);
    await openDetail(picker.seriesId, 'keep');
    await loadGrid();
  } catch (e) {
    toast('失敗: ' + e.message, 6000);
    all.forEach((b) => { b.disabled = false; });
    btn.textContent = 'このシリーズにする';
  }
}

/** 1 巻 (または代表表紙) の絵だけ差し替える。書誌は触らない */
async function useOneCover(btn) {
  const target = btn.dataset.target === '' ? null : Number(btn.dataset.target);
  const before = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>';
  try {
    await api(`/api/series/${picker.seriesId}/cover`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        volume: target, provider: btn.dataset.provider,
        imageUrl: btn.dataset.use, isbn: btn.dataset.isbn || null,
      }),
    });
    toast(target === null ? '代表表紙にしました' : `${volLabel(target)}の表紙にしました`);
    await loadGrid();
    // 巻を指定して来たなら用は済んだ。作品へ戻って結果を見せる
    if (picker.volume !== null) { await openDetail(picker.seriesId, 'keep'); return; }
    btn.disabled = false;
    btn.textContent = before;
  } catch (e) {
    toast('失敗: ' + e.message, 5000);
    btn.disabled = false;
    btn.textContent = before;
  }
}

// ---- シートの開け閉め ---------------------------------------------------

const sheetOpen = () => !$('sheet').hidden;

function showSheet() {
  if (sheetOpen()) return;
  $('sheet').hidden = false;
  // 板の裏で棚が動かないように止める。スマホでここを止めないと、
  // 板の端をなぞった指が後ろの一覧を動かして、閉じた時に見ていた場所を見失う
  document.body.style.overflow = 'hidden';
}

function hideSheet() {
  $('sheet').hidden = true;
  document.body.style.overflow = '';
}

/**
 * × / 背景 / Esc から閉じる。
 * **自分で積んだ履歴は自分で戻す** — 戻さないと、閉じた後の戻るが空振りして
 * 「戻るを 2 回押さないと出られない」状態になる。
 */
function closeSheet() {
  const st = history.state;
  if (st && st.sheetId && !st.entry) {
    history.back();  // 実際に閉じるのは下の popstate
    return;
  }
  hideSheet();
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}

// 戻る / 進むで画面と URL を合わせる。**ここが Android の戻るの受け口**
window.addEventListener('popstate', () => {
  const m = location.hash.match(/^#\/series\/(\d+)/);
  if (m) {
    openDetail(Number(m[1]), 'keep').catch((e) => toast('失敗: ' + e.message, 5000));
    return;
  }
  if (sheetOpen()) hideSheet();
});

// ---- お知らせ -----------------------------------------------------------

const KIND = { series_added: '新着', volume_added: '新刊', series_completed: '完結', volume_gone: '不明' };

async function loadNews() {
  const { events } = await api('/api/events?unread=1&limit=12');
  if (!events.length) { $('news').innerHTML = ''; return; }
  $('news').innerHTML = `<div class="news">
    <div class="news-head">お知らせ <span class="count">${events.length}</span>
      <button class="btn" id="news-read" style="margin-left:auto">既読にする</button></div>
    <ul>${events.map((e) => `<li><span class="kind">${esc(KIND[e.kind] ?? e.kind)}</span>
      <b data-series="${e.series_id ?? ''}">${esc(e.title)}</b> ${esc(e.detail ?? '')}</li>`).join('')}</ul>
  </div>`;
  $('news-read').addEventListener('click', async () => {
    await api('/api/events/read', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: events.map((e) => e.id) }),
    });
    loadNews();
  });
  $('news').querySelectorAll('b[data-series]').forEach((el) => {
    if (!el.dataset.series) return;
    el.style.cursor = 'pointer';
    el.addEventListener('click', () => openDetail(Number(el.dataset.series)));
  });
}

async function loadStats() {
  const h = await api('/api/health');
  // エクスプローラを開けるかは接続元次第 (reveal.ts の頭)。サーバーの答えをそのまま使う
  if (h.reveal) caps.reveal = h.reveal;
  const c = h.counts;
  $('stats').innerHTML =
    `<span><b>${c.series}</b> 作品</span><span><b>${c.files}</b> 冊</span><span>表紙 <b>${c.covers}</b></span>`;
}

// ---- つなぎ込み ---------------------------------------------------------

$('grid').addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (card) openDetail(Number(card.dataset.id));
});
// 背景を叩いて閉じる。**押し始めが背景だった時だけ** —
// click は押した所と離した所の共通の親で起きるので、板の上の文字を選んだ指を
// 背景で離すと target が .sheet になり、選んだだけで板が消える
let pressedOnBackdrop = false;
$('sheet').addEventListener('pointerdown', (e) => { pressedOnBackdrop = e.target === $('sheet'); });
$('sheet').addEventListener('click', (e) => { if (pressedOnBackdrop && e.target === $('sheet')) closeSheet(); });
$('sheet-close').addEventListener('click', closeSheet);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sheetOpen()) closeSheet(); });

let qTimer = null;
$('q').addEventListener('input', (e) => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { state.q = e.target.value.trim(); loadGrid(); }, 250);
});

const toggle = (id, apply) => {
  $(id).addEventListener('click', () => {
    const on = $(id).getAttribute('aria-pressed') === 'true';
    $(id).setAttribute('aria-pressed', String(!on));
    apply(!on);
    loadGrid();
  });
};
toggle('f-gaps', (on) => { state.gaps = on; });
toggle('f-behind', (on) => { state.behind = on; });
toggle('f-nocover', (on) => { state.needsCover = on; });
toggle('f-issues', (on) => { state.issues = on; });
toggle('f-done', (on) => {
  state.completed = on ? true : undefined;
  if (on) { $('f-ongoing').setAttribute('aria-pressed', 'false'); }
});
toggle('f-ongoing', (on) => {
  state.completed = on ? false : undefined;
  if (on) { $('f-done').setAttribute('aria-pressed', 'false'); }
});
$('sort').addEventListener('change', (e) => { state.sort = e.target.value; loadGrid(); });

// スマホでだけ出る ⋯。棚の読み直しと表紙の取得を畳んでおく (PC では常に出ている)
$('more').addEventListener('click', () => {
  const open = $('acts').dataset.open === '1';
  $('acts').dataset.open = open ? '' : '1';
  $('more').setAttribute('aria-expanded', String(!open));
});

$('scan').addEventListener('click', async () => {
  const b = $('scan');
  b.disabled = true;
  b.innerHTML = '<span class="spin"></span> 読み直し中';
  try {
    const { results } = await api('/api/scan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const r = results[0] ?? {};
    toast(r.error ? r.error : `${r.filesSeen} ファイル / 作品 +${r.seriesAdded} / 巻 +${r.volumesAdded}`, 5000);
    await Promise.all([loadGrid(), loadNews(), loadStats()]);
  } catch (e) { toast('失敗: ' + e.message, 5000); }
  b.disabled = false;
  b.textContent = '棚を読み直す';
});

$('fill').addEventListener('click', async () => {
  const b = $('fill');
  b.disabled = true;
  b.innerHTML = '<span class="spin"></span> 取得中';
  try {
    const { results } = await api('/api/covers/fill', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ seriesLimit: 5 }),
    });
    const n = results.reduce((a, r) => a + r.coversWritten, 0);
    toast(n ? `${results.length} 作品 / 表紙 ${n} 枚を焼きました` : `${results.length} 作品を見ましたが表紙は取れませんでした`, 5000);
    await Promise.all([loadGrid(), loadStats()]);
  } catch (e) { toast('失敗: ' + e.message, 5000); }
  b.disabled = false;
  b.textContent = '表紙を進める';
});

(async () => {
  await Promise.all([loadStats(), loadNews(), loadGrid()]);
  const m = location.hash.match(/^#\/series\/(\d+)/);
  // 入口がここなら積むものが無い。'entry' で置き換えるだけにして、
  // 戻るは素直に pinax の外へ出す (積んでおくと戻るが空振りする)
  if (m) openDetail(Number(m[1]), 'entry');
})();
</script>
